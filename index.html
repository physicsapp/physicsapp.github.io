function drawRaceCar(ctx,x,y,h,s,fill,ink,alpha){
  ctx.save();ctx.globalAlpha=alpha||1;ctx.translate(x,y);ctx.rotate(-h);
  const l=Math.max(16,4.6*s),w=Math.max(9,2*s);
  ctx.fillStyle=ink;ctx.fillRect(-l*0.32-3,-w/2-2,6,3);ctx.fillRect(-l*0.32-3,w/2-1,6,3);ctx.fillRect(l*0.3-3,-w/2-2,6,3);ctx.fillRect(l*0.3-3,w/2-1,6,3);
  ctx.fillStyle=fill;ctx.strokeStyle=ink;ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(-l/2,-w/2);ctx.lineTo(l*0.3,-w/2);ctx.lineTo(l/2,0);ctx.lineTo(l*0.3,w/2);ctx.lineTo(-l/2,w/2);ctx.closePath();ctx.fill();ctx.stroke();

function drawRace(t,F,m){

  const cs=getComputedStyle(document.documentElement),col=n=>cs.getPropertyValue(n).trim()||"#888";

    ctx.strokeStyle=col("--ink");ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(0,ry);ctx.lineTo(W,ry);ctx.moveTo(0,ry+rh);ctx.lineTo(W,ry+rh);ctx.stroke();

    drawRaceCar(ctx,W*0.32,ry+rh/2+12,0,4,col("--petal-1"),col("--ink"));
    const gx=46,gr=W-14,gt=160,gb=H-34,vMax=Math.max(F.vt,...m.choices.map(q=>q.v))*1.12;
    const GX=u=>gx+u/F.tEnd*(gr-gx),GY=s=>gb-s/vMax*(gb-gt);
    ctx.strokeStyle=col("--ink");ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(gx,gt-4);ctx.lineTo(gx,gb);ctx.lineTo(gr,gb);ctx.stroke();
    ctx.fillStyle=col("--muted");ctx.textAlign="left";ctx.fillText("speed (m/s)",gx-34,gt-18);

    const ts=F.tEnd<=60?10:20;ctx.textAlign="center";for(let s=0;s<=F.tEnd;s+=ts)ctx.fillText(`${s} s`,GX(s),gb+12);
    if(c){ctx.strokeStyle=col("--accent");ctx.lineWidth=2;ctx.setLineDash([6,4]);ctx.beginPath();ctx.moveTo(gx,GY(c.v));ctx.lineTo(gr,GY(c.v));ctx.stroke();ctx.setLineDash([]);
      ctx.fillStyle=col("--accent");ctx.textAlign="right";ctx.fillText("you",gr,GY(c.v)+(c.v>F.vt?-9:9));}
    if(!pre){ctx.strokeStyle=col("--ink");ctx.lineWidth=2.2;ctx.beginPath();for(let u=0;u<=tt;u+=F.tEnd/300){const y=GY(F.vAt(u));if(u===0)ctx.moveTo(GX(u),y);else ctx.lineTo(GX(u),y);}ctx.lineTo(GX(tt),GY(v));ctx.stroke();}
    ctx.fillStyle=col("--ink");ctx.textAlign="left";
    ctx.fillText(`t = ${tt.toFixed(1)} s   v = ${fmtNum(v)} m/s   drag = ${fmtNum(0.5*m.C*RACE_RHO*m.A*v*v)} N`,12,14);
    if(c&&!pre){ctx.fillStyle=col("--accent");ctx.fillText(`sent: ${c.t}`,12,30);ctx.fillStyle=col("--muted");ctx.textAlign="right";ctx.fillText(`push ${m.F} N`,W-12,30);ctx.textAlign="left";}

  const secs=d.sections.map(x=>x.num);
  let r={sum:{},items:[],eqs:{},errs:[`notes/ch${pad2(n)}.txt could not be loaded, so summaries and review items are missing.`]};

    const rows=clumpRows(fr.length),ys=rows.length===1?[76]:rows.length===2?[64,81]:[60,71,83];
    let i=0;
    rows.forEach((m,r)=>{const sc=0.8+0.2*(r+1)/rows.length,gap=Math.min(20,(rows.length>1&&r===0?60:70)/Math.max(1,m-0.4));
      for(let j=0;j<m;j++,i++){
        const x=50+(j-(m-1)/2)*gap+(rnd01(n*31+i)-0.5)*5,y=ys[r]+(rnd01(n*17+i*7)-0.5)*4;
        g+=miniPlant(x,y,fr[i],i,sc);}});
    if(fr.length&&fr.every(f=>f>=BLOOM)){
      let p=`<path d="M6 93 H94 M6 97 H94" stroke="var(--pot-shade)" stroke-width="1.4"/>`;
      for(let x=8;x<=92;x+=7)p+=`<path d="M${x-1.6} 99 V91 l1.6 -2 l1.6 2 V99 Z" fill="var(--pot)" stroke="var(--pot-shade)" stroke-width=".8"/>`;
      g+=p;}
  }
  g+=`<path d="M17 24 V60" stroke="var(--soil-seed)" stroke-width="2.4" stroke-linecap="round"/>
    <rect x="4" y="6" width="26" height="19" rx="3" fill="var(--card)" stroke="var(--soil-seed)" stroke-width="1.6"/>
    <text x="17" y="20.5" text-anchor="middle" font-size="14" font-weight="700" fill="var(--ink)" font-family="var(--font-mono)">${n}</text>`;
  return `<svg viewBox="0 0 100 100" role="img" aria-label="${esc(label)}">${g}</svg>`;
}
function chFracs(n){

  const secs=c&&c.secs?c.secs:meta&&meta.secs?Array.from({length:meta.secs},(_,i)=>`${n}.${i+1}`):null;
  if(!secs)return null;
  const p=store("progress-ch"+n)||{},b=bloomFor(n);
  return secs.map(s=>p.preview?1:Math.min(1,((p.grow||{})[s]||0)/b));
}
function fieldHTML(r){
  let tot=0,bl=0;

    const k=fr?fr.length:0,b=fr?fr.filter(f=>f>=BLOOM).length:0;tot+=k;bl+=b;
    const txt=fr?(BIGCOLS===3?`${b} of ${k}`:`${b}/${k}`):"";
    return `<button type="button" class="plot" data-n="${n}" aria-pressed="${FSEL===n}" aria-label="Chapter ${n}, ${esc(t)}${fr?`, ${b} of ${k} plants in bloom`:""}">${plotSVG(n,fr||[],`Chapter ${n} plot`)}<span class="plotlbl">${txt||"&nbsp;"}</span></button>`;});
  return {cells:cells.join(""),tot,bl};
}
function fieldSection(r){

    <div class="fieldhead"><div><h2>The whole garden</h2><p class="small muted" id="fieldsum">${f.tot?`${f.bl} of ${plural(f.tot,"flower")} in bloom`:""}</p></div>
      <div class="seg" role="group" aria-label="Garden layout"><button type="button" data-cols="5" aria-pressed="${BIGCOLS===5}">5 across</button><button type="button" data-cols="3" aria-pressed="${BIGCOLS===3}">3 across</button></div></div>
    <div class="paper field" id="fieldgrid" style="grid-template-columns:repeat(${BIGCOLS},minmax(0,1fr))">${f.cells}</div>

function wireField(r,my){
  const redraw=()=>{const g=document.getElementById("fieldgrid");if(!g)return;const f=fieldHTML(r);g.style.gridTemplateColumns=`repeat(${BIGCOLS},minmax(0,1fr))`;g.innerHTML=f.cells;

    const c=document.getElementById("fieldpick");if(c){c.innerHTML=pickCard(r);wireGo();if(FSEL)c.scrollIntoView({block:"nearest",behavior:"smooth"});}});

  /* chapters never opened on this device: read their section count from the book */
  const meta=store("chapters")||{},need=readyList(r).filter(n=>!(CACHE[n]&&CACHE[n].secs)&&!(meta[n]&&meta[n].secs));
  if(need.length)Promise.all(need.map(n=>fetchBook(n).then(d=>{if(d&&d.sections){const m=store("chapters")||{};m[n]={secs:d.sections.length};store("chapters",m);}})))
    .then(()=>{if(my===ROUTE_N)redraw();});

async function renderReviewPicker(my){

async function renderEqPicker(my){

  CHAPTERS.forEach(([n])=>{if(!B[n])return;

function loadFail(what){
  main.innerHTML=`<p class="note err">The chapter content (${esc(what)}) didn't load. If you opened index.html straight from your computer, open it through a web address instead, such as GitHub Pages. Otherwise check your connection and reload.</p>`;
}

/* ---------- router ---------- */
/* Addresses: #chapters is the menu, #equations and #review pick a chapter, #calc is the calculator (#solver goes there), #ch4 a chapter, #ch4/4.2 a section, #ch4/equations, #ch4/review, #ch3/launch.
   Older links like #learn and #sec-3-2 still work and are sent to the matching new address. */
/* ---------- tab memory ----------
   Each tab remembers the last page shown in it (TABM, saved as fb:tabs). Tapping a different tab goes back to that page
   and puts back what it looked like: scroll position, open worked examples and answers, and search words (VIEW, per address,
   kept while the app is open). Tapping the tab you are already on goes up one level (tabUp): section to chapter to menu,
   minigame to garden to chapter picker, chapter equations to picker. */
const TABROOT={learn:()=>"#chapters",equations:()=>"#equations",calc:()=>"#calc",review:()=>"#review"};
function tabUp(t,h){
  const m=h.match(/^#ch(\d+)(?:\/(.+))?$/);
  if(!m)return TABROOT[t]();
  if(t==="learn")return m[2]&&m[2]!=="about"?"#ch"+m[1]:"#chapters";
  if(t==="review")return m[2]&&m[2]!=="review"?"#ch"+m[1]+"/review":"#review";
  return TABROOT[t]();
}
let TABM=store("tabs")||{},CURTAB="",LASTHASH=null,RESTORE=false;
const VIEW={};
function setTab(t){
  CURTAB=t;
  if(t){TABM[t]=location.hash||"#chapters";store("tabs",TABM);}
  document.querySelectorAll(".tabs a").forEach(a=>{if(a.dataset.tab===t)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current");});
  setTabLinks();
}
function snapView(){
  if(LASTHASH==null)return;
  VIEW[LASTHASH]={y:window.scrollY,open:[...main.querySelectorAll("details")].map(d=>d.open),
    q:[...main.querySelectorAll("input[type=search]")].map(i=>[i.id,i.value])};
  LASTHASH=null;
}
function restoreView(h){
  const v=VIEW[h];if(!v){window.scrollTo(0,0);return;}
  const ds=main.querySelectorAll("details");if(ds.length===v.open.length)ds.forEach((d,i)=>{d.open=v.open[i];});
  v.q.forEach(([id,val])=>{const el=id&&document.getElementById(id);if(el&&val){el.value=val;el.dispatchEvent(new Event("input"));}});
  /* math and search results change the page height for a moment, so try the scroll a few times unless the student moves first */
  let moved=false;const stop=()=>{moved=true;};
  ["wheel","touchstart","keydown"].forEach(e=>window.addEventListener(e,stop,{once:true,passive:true}));
  [0,120,350,800,1400].forEach(ms=>setTimeout(()=>{if(!moved&&LASTHASH===h)window.scrollTo(0,v.y);},ms));
}
function wireTabs(){
  document.querySelectorAll(".tabs a").forEach(a=>a.addEventListener("click",e=>{
    const t=a.dataset.tab;
    if(t===CURTAB){e.preventDefault();const r=tabUp(t,location.hash||"#chapters");
      if(location.hash!==r)location.hash=r;else window.scrollTo({top:0,behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});return;}
    RESTORE=true;}));
  const keep=()=>{snapView0();saveCalc();};
  window.addEventListener("pagehide",keep);
  document.addEventListener("visibilitychange",()=>{if(document.hidden)keep();});
}
/* a snapshot that does not end the page (used when the app is put in the background) */
function snapView0(){const h=LASTHASH;if(h==null)return;snapView();LASTHASH=h;}
let ROUTE_N=0;
async function route(){
  const my=++ROUTE_N;
  snapView();cancelAnimationFrame(LP.raf);
  const h=decodeURIComponent((location.hash||"").slice(1));let m;
  if((m=h.match(/^sec-(\d+)-(\d+)$/))){location.replace(`#ch${+m[1]}/${+m[1]}.${+m[2]}`);return;}
  if(/^(learn|practice|launch)$/.test(h)){location.replace(`#ch${lastCh()}`+(h==="learn"?"":"/"+(h==="practice"?"review":h)));return;}
  await loadSetup();
  if(my!==ROUTE_N)return;
  const done=()=>{const r=RESTORE;RESTORE=false;LASTHASH=location.hash;if(r)restoreView(LASTHASH);else window.scrollTo(0,0);typeset(main);};
  if(!h||h==="chapters"){setTab("learn");await renderMenu(my);if(my===ROUTE_N)done();return;}
  if(h==="equations"){setTab("equations");await renderEqPicker(my);if(my===ROUTE_N)done();return;}
  if(h==="review"){setTab("review");await renderReviewPicker(my);if(my===ROUTE_N)done();return;}
  if(h==="solver"){location.replace("#calc");return;}
  if(h==="calc"){setTab("calc");renderCalc();done();return;}
  /* every other page needs a chapter: the one in the address, or the last one opened */
  m=h.match(/^ch(\d+)(?:\/(.*))?$/);
  const want=m?+m[1]:(CH||lastCh()),sub=m?(m[2]||""):h;
  if(m&&!CHAPTERS.some(c=>c[0]===want)){location.replace("#chapters");return;}
  if(want!==CH){
    main.innerHTML=`<p class="muted">Loading chapter…</p>`;
    let st=await fetchChapter(want);
    if(my!==ROUTE_N)return;
    if(st!=="ok"&&!m&&want!==3){st=await fetchChapter(3);if(my!==ROUTE_N)return;if(st==="ok"){useChapter(3);}}
    else if(st==="ok"&&CACHE[want].bad){setTab("learn");loadFail(CACHE[want].bad);return;}
    else if(st==="ok")useChapter(want);
    if(st==="missing"){setTab("learn");renderSoon(want);done();return;}
    if(st==="error"){loadFail(`book/ch${pad2(want)}.json`);return;}
  }
  if(sub==="about"){renderAbout();setTab("");}
  else if(!m){location.replace("#chapters");return;}
  else if((m=sub.match(/^(\d+)\.(\d+)$/))&&S.some(x=>x.num===sub)){renderSection(S.findIndex(x=>x.num===sub));setTab("learn");}
  else if(sub==="equations"){renderEquations();setTab("equations");}
  else if(sub==="review"||sub==="practice"){renderGarden();setTab("review");}
  else if(toy()&&sub===toy().route){renderGame();setTab("review");}
  else{if(sub)return location.replace(H(""));renderLearn();setTab("learn");}
  done();
}
window.addEventListener("hashchange",route);
function boot(){
  setTabLinks();wireTabs();
  route();
  window.__fb={calcEval,calcFmt,sig,makeDrill,parseNotes,record,queueFor,secFrac,makeMission,flight,makeLanding,landSim,makeSail,sailSim,makeCat,catSim,makeElv,elvSim,makeRace,raceSim,backupCode,readBackup,get CH(){return CH},get LP(){return LP},get ITEMS(){return ITEMS},get ERRS(){return NOTE_ERRS},get PROG(){return PROG},set PROG(v){PROG=v},setDay(n){DAY_OFF=n}};
}
boot();
})();
