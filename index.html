<!--repo-head--><!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<!--/repo-head-->
<title>Freebody Physics</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: phone app shell. Sticky top bar, one reading column (max 720px), fixed bottom tab bar. Graph paper motif marks "worked on paper" areas. */
:root{
  --paper:#f5f7f9; --card:#ffffff; --ink:#15202e; --muted:#5b6878; --rule:#d9e0e7;
  --grid:rgba(32,96,140,.09); --accent:#0d6e7a; --accent-ink:#ffffff; --accent-soft:#e1f0f1;
  --eq-bg:#eef3f7; --good:#1f7a3f; --good-soft:#e3f3e8; --bad:#b3261e; --bad-soft:#fbe7e5;
  --font-display:"Archivo","Arial Narrow",Arial,sans-serif;
  --font-body:"Source Sans 3","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --tabbar-h:60px; --grid-line:rgba(21,32,46,.08);
  --pot:#c7d3dc; --pot-shade:#aebdc9; --soil:#6e5a45; --soil-seed:#a88a5e; --stem:#4c8a48; --turf:#5b8550; --leaf:#5aa055; --leaf2:#7dbd6c;
  --petal-1:#e46a52; --petal-2:#e9a92a; --petal-3:#8a6ad0; --petal-4:#dc5b98; --petal-5:#3a93d2; --petal-6:#f0873a; --center:#f3cf4b;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#10161d; --card:#18212b; --ink:#e4eaf0; --muted:#98a6b5; --rule:#2a3542;
  --grid:rgba(120,190,230,.07); --accent:#4cc0c8; --accent-ink:#0b1a1d; --accent-soft:#16343a;
  --eq-bg:#1d2833; --good:#6fd394; --good-soft:#173525; --bad:#ff8a80; --bad-soft:#3a1c1a; --grid-line:rgba(228,234,240,.08);
  --pot:#3d4955; --pot-shade:#2f3a45; --soil:#4d3d2f; --soil-seed:#8a704c; --stem:#6aae64; --turf:#3d6438; --leaf:#74bd6c; --leaf2:#93d185;
  --petal-1:#ff8a73; --petal-2:#f5bf4a; --petal-3:#a98bf0; --petal-4:#f07ab0; --petal-5:#5fb2ee; --petal-6:#ffa25c; --center:#f6d860; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#10161d; --card:#18212b; --ink:#e4eaf0; --muted:#98a6b5; --rule:#2a3542;
  --grid:rgba(120,190,230,.07); --accent:#4cc0c8; --accent-ink:#0b1a1d; --accent-soft:#16343a;
  --eq-bg:#1d2833; --good:#6fd394; --good-soft:#173525; --bad:#ff8a80; --bad-soft:#3a1c1a; --grid-line:rgba(228,234,240,.08);
  --pot:#3d4955; --pot-shade:#2f3a45; --soil:#4d3d2f; --soil-seed:#8a704c; --stem:#6aae64; --turf:#3d6438; --leaf:#74bd6c; --leaf2:#93d185;
  --petal-1:#ff8a73; --petal-2:#f5bf4a; --petal-3:#a98bf0; --petal-4:#f07ab0; --petal-5:#5fb2ee; --petal-6:#ffa25c; --center:#f6d860; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:17px;line-height:1.55;
  padding-bottom:calc(var(--tabbar-h) + env(safe-area-inset-bottom,0px) + 24px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--font-display);font-stretch:85%;line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:1.75rem;font-weight:800}
h2{font-size:1.2rem;font-weight:700}
h3{font-size:1.02rem;font-weight:700}
p{margin:0}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--rule)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.brand{font-family:var(--font-display);font-weight:800;font-stretch:80%;font-size:1.1rem;letter-spacing:.01em;text-decoration:none;color:var(--ink);display:flex;align-items:center;gap:8px}
.brand svg{flex:none}
.crumb{flex:1;min-width:0;color:var(--muted);font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{border:1px solid var(--rule);background:var(--card);border-radius:999px;width:34px;height:34px;display:grid;place-items:center;cursor:pointer;text-decoration:none;color:var(--ink);font-family:var(--font-display);font-weight:700}

main{display:flex;flex-direction:column;gap:22px;padding-block:20px}
.stack{display:flex;flex-direction:column;gap:12px}
.eyebrow{font-family:var(--font-display);font-stretch:80%;font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.muted{color:var(--muted)}
.small{font-size:.9rem}

/* graph paper surfaces */
.paper{background-color:var(--card);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:16px 16px;border:1px solid var(--rule);border-radius:14px}
.hero{padding:18px;display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center}
.hero .num{font-family:var(--font-mono);color:var(--muted);font-size:.85rem}
.hero svg{width:132px;height:auto;max-width:100%}
@media (max-width:420px){.hero{grid-template-columns:1fr}.hero svg{width:100%;max-width:260px}}

.card{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:16px;min-width:0}
.seclist{display:flex;flex-direction:column;gap:10px}
.secrow{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:14px}
.secrow:hover{border-color:var(--accent)}
.secrow .n{font-family:var(--font-mono);font-weight:500;font-size:1.05rem;color:var(--accent)}
.secrow .t{font-weight:600;line-height:1.3;min-width:0}
.secrow .meta{font-size:.82rem;color:var(--muted);font-weight:400;margin-top:2px}
.secrow.soon{background:transparent;border-style:dashed}
.secrow.soon .n,.secrow.soon .t{color:var(--muted)}
.hero.plain{grid-template-columns:1fr}
.backlink{font-size:.9rem;color:var(--accent);text-decoration:none;font-weight:600;width:max-content}
.backlink:hover{text-decoration:underline}
.chev{color:var(--muted)}

.classdate{margin:0;font-family:var(--font-mono);font-size:.85rem;color:var(--accent)}
.inshort{border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 12px 12px 0;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.watch{display:flex;gap:8px;font-size:.95rem}
.watch b{font-family:var(--font-display);font-stretch:85%;white-space:nowrap}
.bullets{margin:0;padding-left:1.15em;display:flex;flex-direction:column;gap:8px}

.eqbox{background:var(--eq-bg);border-radius:10px;padding:10px 12px;overflow-x:auto;overflow-y:hidden}
.eqgrid{display:flex;flex-direction:column;gap:8px}
.eqname{font-size:.8rem;color:var(--muted);margin-bottom:-2px}
.eq{overflow-x:auto;overflow-y:hidden;max-width:100%}
mjx-container[display="true"]{margin:.4em 0!important}
mjx-container{max-width:100%}
mjx-container.wide{display:inline-block;max-width:100%;overflow-x:auto;overflow-y:hidden;vertical-align:middle}
mjx-container{position:relative}
mjx-container[display="true"]{overflow-x:auto;overflow-y:hidden}

details.ex{background:var(--card);border:1px solid var(--rule);border-radius:12px;min-width:0}
details.ex>summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;gap:10px;align-items:baseline}
details.ex>summary::-webkit-details-marker{display:none}
details.ex>summary .k{font-family:var(--font-mono);font-size:.8rem;color:var(--muted);flex:none}
details.ex>summary .tt{flex:1;font-weight:600}
details.ex>summary .plus{font-family:var(--font-mono);color:var(--accent);transition:transform .2s}
details.ex[open]>summary .plus{transform:rotate(45deg)}
.exbody{padding:0 16px 16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.part{display:flex;flex-direction:column;gap:8px;min-width:0}
.part>.lbl{font-family:var(--font-display);font-stretch:80%;font-weight:700;font-size:.8rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.rich{display:flex;flex-direction:column;gap:8px;min-width:0}
.rich ol,.rich ul{margin:0;padding-left:1.3em}
figure{margin:4px 0;display:flex;flex-direction:column;gap:6px}
figure img{border-radius:8px;background:#fff;border:1px solid var(--rule)}
figcaption{font-size:.85rem;color:var(--muted)}

.reveal{margin-top:8px}
.reveal>summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:.95rem;width:max-content}
.reveal .ans{margin-top:8px;padding:12px;border-radius:10px;background:var(--eq-bg)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:10px;padding:10px 16px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);font-weight:600;cursor:pointer;text-decoration:none;min-height:44px}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.quiet{border-color:var(--rule);background:var(--card);color:var(--ink)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pager a{text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:12px;font-size:.9rem;min-width:0}
.pager a span{display:block;font-family:var(--font-mono);font-size:.75rem;color:var(--muted)}
.pager a.next{text-align:right}

.attrib{font-size:.8rem;color:var(--muted);border-top:1px solid var(--rule);padding-top:14px}

/* segmented + chips */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--eq-bg);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;border-radius:9px;padding:9px 6px;font-weight:600;cursor:pointer;color:var(--muted);min-height:40px}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--rule);background:var(--card);border-radius:999px;padding:6px 12px;font-family:var(--font-mono);font-size:.82rem;cursor:pointer;min-height:36px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
/* chapter switcher and pickers */
.chswitch{display:flex;align-items:center;gap:10px;min-width:0}
.chswitch .lbl{font-size:.82rem;color:var(--muted);font-weight:600;flex:none}
.chswitch .chips{flex:1;min-width:0;gap:6px}
a.chip{display:inline-grid;place-items:center;min-width:42px;min-height:44px;padding:0 12px;text-decoration:none;color:var(--ink);font-size:.95rem}
a.chip[aria-current="page"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.secrow.cur{border-color:var(--accent);box-shadow:inset 4px 0 0 var(--accent)}
.eqhit .open{font-size:.85rem;font-weight:600;color:var(--accent);text-decoration:none;padding:6px 0;width:max-content}

/* equations */
.search{width:100%;border:1px solid var(--rule);background:var(--card);border-radius:10px;padding:12px 14px;font:inherit;color:var(--ink)}
.eqcard{display:flex;flex-direction:column;gap:6px}
.eqcard .head{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.eqcard .tag{font-family:var(--font-mono);font-size:.75rem;color:var(--muted);flex:none}

.note{font-size:.9rem;padding:10px 12px;border-radius:10px;background:var(--eq-bg)}
.note.err{background:var(--bad-soft);color:var(--bad)}

/* calculator */
.calchead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.angseg{width:124px;flex:none}
.calcbox{display:flex;flex-direction:column;gap:10px}
.calcdisp{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:10px 14px 8px}
.calcdisp:focus-within{border-color:var(--accent)}
.cx{width:100%;border:0;background:transparent;font-family:var(--font-mono);font-size:1.3rem;color:var(--ink);text-align:right;outline:none;padding:6px 0}
.cres{min-height:62px;text-align:right;display:flex;flex-direction:column;gap:2px}
.cres .cval{font-family:var(--font-mono);font-size:1.05rem;color:var(--muted);overflow-wrap:anywhere}
.cres .cval.big{font-size:1.55rem;color:var(--ink);font-weight:500}
.c3{font-size:.8rem;color:var(--muted);font-family:var(--font-mono)}
.cerr{color:var(--bad);font-size:.88rem}
.cmode{font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left}
.prefixes{display:grid;grid-template-columns:repeat(8,1fr);gap:5px}
.pk{min-height:42px;border:1px solid var(--rule);background:var(--card);color:var(--accent);border-radius:10px;font-family:var(--font-mono);font-size:1rem;font-weight:600;cursor:pointer;padding:0}
.keypad{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.key{min-height:50px;border:0;border-radius:12px;background:var(--card);color:var(--ink);font-family:var(--font-mono);font-size:1.15rem;cursor:pointer;box-shadow:inset 0 0 0 1px var(--rule);padding:0;touch-action:manipulation}
.key.fn,.key.fnk{background:var(--eq-bg);font-size:.95rem}
.key.op{background:var(--eq-bg)}
.key.sci{font-size:.95rem}
.key.eq{background:var(--accent);color:var(--accent-ink);box-shadow:none;font-weight:600}
.key[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.key:active,.pk:active,.crow:active{transform:scale(.97)}
.cpnote{margin:2px 0}
.clist{display:flex;flex-direction:column;gap:8px}
.crow{display:grid;grid-template-columns:56px 1fr;column-gap:10px;row-gap:2px;align-items:baseline;text-align:left;background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:10px 12px;color:var(--ink);font:inherit;cursor:pointer;min-height:48px;width:100%}
.crow .sym{grid-row:span 2;font-family:var(--font-mono);font-weight:600;color:var(--accent);font-size:1rem}
.crow .cname{font-weight:600;font-size:.92rem}
.crow .cnote{display:block;font-weight:400;font-size:.8rem;color:var(--muted)}
.crow .cval{font-family:var(--font-mono);font-size:.88rem;color:var(--muted)}
.crow .u{font-family:var(--font-body,inherit)}
.hrow{grid-template-columns:1fr}
.hrow .hx{font-family:var(--font-mono);font-size:.85rem;color:var(--muted);overflow-wrap:anywhere}
.hrow .cval{color:var(--ink);font-size:1rem}

/* practice */
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;border:1px solid var(--rule);background:var(--card);border-radius:10px;padding:12px 14px;cursor:pointer;min-height:48px}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.fb{padding:12px 14px;border-radius:10px;display:flex;flex-direction:column;gap:6px}
.fb.good{background:var(--good-soft)} .fb.bad{background:var(--bad-soft)}
.fb b{font-family:var(--font-display);font-stretch:85%}
.score{font-family:var(--font-mono);font-size:.85rem;color:var(--muted)}
.probhead{display:flex;justify-content:space-between;gap:10px;font-family:var(--font-mono);font-size:.8rem;color:var(--muted)}
.toggle{display:flex;gap:8px;align-items:center;font-size:.92rem;cursor:pointer}
.toggle input{width:18px;height:18px;accent-color:var(--accent)}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--rule);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.tabs nav{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--tabbar-h)}
.tabs a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;color:var(--muted);font-size:.75rem;font-weight:600}
.tabs a svg{width:22px;height:22px}
.tabs a[aria-current="page"]{color:var(--accent)}
/* garden and review */
.garden{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:12px 8px}
.garden.grown{grid-template-columns:repeat(auto-fit,minmax(96px,1fr))}
.pot{border:1px solid transparent;background:transparent;border-radius:12px;padding:4px 2px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.pot.static{cursor:default}
.field{display:grid;gap:4px;padding:10px 6px}
.plot{display:flex;flex-direction:column;align-items:center;gap:0;color:var(--ink);border:0;background:transparent;font:inherit;border-radius:10px;padding:2px 0 4px;min-width:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.plot svg{width:100%;height:auto;display:block}
.plot[aria-pressed="true"]{background:var(--accent-soft)}
.plot[aria-pressed="true"] .plotlbl{color:var(--ink);font-weight:700}
@media (hover:hover){.plot:hover:not([aria-pressed="true"]){background:var(--card)}}
.plot.soon .plotlbl{opacity:.75}
.plot.soon svg{opacity:.6}
.plotlbl{font-size:.72rem;line-height:1.2;color:var(--muted);font-family:var(--font-mono);white-space:nowrap}
.fieldhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.fieldhead .seg{min-width:170px}
.pot svg{width:100%;max-width:120px;height:auto}
.pot.sel,.pot:hover:not(.static){border-color:var(--accent);background:var(--card)}
.potlbl{font-size:.78rem;color:var(--muted);text-align:center;line-height:1.2}
.potlbl b{font-family:var(--font-mono);color:var(--ink);font-weight:500;display:block}
.btn.big{width:100%;min-height:52px;font-size:1.05rem}
.btn[disabled]{opacity:.55;cursor:default}
.startcard{text-align:left}
.rocketcard{display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:center}
.rocketcard svg{width:96px;height:auto}
.howgrow summary,.card>summary{cursor:pointer}
.code{width:100%;font-family:var(--font-mono);font-size:.8rem;border:1px solid var(--rule);border-radius:10px;padding:10px;background:var(--eq-bg);color:var(--ink);resize:vertical}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:600;cursor:pointer;padding:6px 0}
.note.good{background:var(--good-soft);color:var(--ink)}
.sesshead{display:flex;align-items:center;justify-content:space-between;gap:12px}
.dots{display:flex;flex-wrap:wrap;gap:6px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--rule)}
.dot.cur{background:var(--accent)} .dot.ok{background:var(--good)} .dot.no{background:var(--bad)}
.qtext{font-size:1.08rem}
.opt.chosen{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.checkbtn{width:100%;margin-top:4px}
.graphwrap{background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:6px}
.graph{width:100%;height:auto;display:block;touch-action:manipulation}
.graph.tappable{cursor:crosshair}
.nextbar{position:sticky;bottom:calc(var(--tabbar-h) + env(safe-area-inset-bottom,0px) + 10px);z-index:4}
.flightwrap{padding:0;overflow:hidden}
.flightwrap canvas{display:block;width:100%;height:340px}
.chip[disabled]{opacity:.45;cursor:default}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<header class="top"><div class="wrap">
  <a class="brand" href="#chapters" aria-label="Freebody Physics, all chapters">
    <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><rect x="7" y="7" width="8" height="8" rx="1.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M11 7V1M11 15v6M15 11h6M7 11H1" stroke="var(--accent)" stroke-width="2" stroke-linecap="round"/></svg>
    Freebody
  </a>
  <div class="crumb" id="crumb"></div>
  <a class="iconbtn" href="#about" aria-label="About and license">i</a>

<script>
(function(){
"use strict";
let D=null,S=[];
const main=document.getElementById("main");
const crumb=document.getElementById("crumb");
const G=9.80;

/* OpenStax page names follow the section number and title, like 3-1-position-displacement-and-average-velocity */
const slug=s=>s.num.replace(".","-")+"-"+s.title.toLowerCase().replace(/['’]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"");
const bookUrl=i=>"https://openstax.org/books/university-physics-volume-1/pages/"+slug(S[i]);

/* ---------- chapters ---------- */
/* A chapter appears in the menu as soon as book/chNN.json is on the site. notes/chNN.txt adds its summaries and review items. */
const CHAPTERS=[[1,"Units and Measurement"],[2,"Vectors"],[3,"Motion Along a Straight Line"],[4,"Motion in Two and Three Dimensions"],[5,"Newton’s Laws of Motion"],[6,"Applications of Newton’s Laws"],[7,"Work and Kinetic Energy"],[8,"Potential Energy and Conservation of Energy"],[9,"Linear Momentum and Collisions"],[10,"Fixed Axis Rotation"],[11,"Angular Momentum"],[12,"Static Equilibrium and Elasticity"],[13,"Gravitation"],[14,"Fluid Mechanics"],[15,"Oscillations"]];
const pad2=n=>String(n).padStart(2,"0");
let CH=0;
const H=r=>"#ch"+(CH||lastCh())+(r?"/"+r:"");
function lastCh(){const n=+store("last-chapter");return CHAPTERS.some(c=>c[0]===n)?n:3;}

/* Short summaries written for this app (adapted, same license as the book). */
let SUMMARY={},ITEMS=[],NOTE_ERRS=[],EQS={};
/* The chapter's equation sheet (Equations tab): lines starred with * in the notes' ## EQUATIONS blocks,
   in section order. A chapter with no EQUATIONS blocks falls back to the book's key equations. */
function sheetOf(n){const c=CACHE[n];if(!c||!c.D)return[];
  const E=c.eqs||{},secs=c.secs.filter(x=>E[x]);
  if(secs.length)return secs.flatMap(x=>E[x].filter(e=>e.sheet));
  const es=(CHX[n]||{}).eqSec||[];
  return(c.D.keyEquations||[]).map((e,j)=>({name:e.name,tex:e.tex,sec:e.sec||es[j]||""}));}
let SECS=[];

/* ---------- notes file parser: summaries and review items you can edit ---------- */
function hashStr(s){let h=2166136261;for(const c of s){h^=c.codePointAt(0);h=Math.imul(h,16777619);}return (h>>>0).toString(36);}
function parsePlot(spec){
  if(!spec)throw new Error('GRAPH needs a "Plot:" line');
  const parts=spec.split(";").map(s=>s.trim()).filter(Boolean);
  const m=parts[0].match(/^([A-Za-z])\s*(?:\(\s*t\s*\))?\s*=\s*(.+)$/);
  if(!m)throw new Error(`Plot: should start like "x = 4*t - t^2"`);
  const p={name:m[1],expr:m[2],t0:0,t1:4,y0:null,y1:null,unit:{x:"m",y:"m",v:"m/s",a:"m/s²"}[m[1]]||""};
  for(const part of parts.slice(1)){
    let r;
    if((r=part.match(/^t\s+from\s+(.+?)\s+to\s+(.+)$/i))){p.t0=evalExpr(r[1],{});p.t1=evalExpr(r[2],{});}
    else if((r=part.match(/^y\s+from\s+(.+?)\s+to\s+(.+)$/i))){p.y0=evalExpr(r[1],{});p.y1=evalExpr(r[2],{});}
    else if((r=part.match(/^unit\s+(.+)$/i))){p.unit=r[1].trim();}
    else throw new Error(`Plot: "${part}" isn't understood. Use "t from 0 to 4", "y from 0 to 5", or "unit m/s"`);
  }
  if(!(p.t1>p.t0))throw new Error("Plot: the t range should go from low to high");
  let lo=Infinity,hi=-Infinity;
  for(let i=0;i<=60;i++){const t=p.t0+(p.t1-p.t0)*i/60;const y=evalExpr(p.expr,{t});if(!isFinite(y))throw new Error(`Plot: the formula isn't a number at t = ${clean(t)}`);lo=Math.min(lo,y);hi=Math.max(hi,y);}
  if(p.y0==null){const pad=(hi-lo)*0.1||1;p.y0=Math.min(0,lo-pad);p.y1=hi+pad;}
  if(!(p.y1>p.y0))throw new Error("Plot: the y range should go from low to high");
  return p;
}
function parseTap(s,plot){
  const m=s.match(/^\s*t\s*=\s*(.+?)(?:\s+within\s+(.+))?\s*$/i);
  if(!m)throw new Error('Tap: should look like "t = 2" or "t = 1, 3 within 0.3"');
  const ts=m[1].split(",").map(x=>evalExpr(x,{}));
  const tol=m[2]?evalExpr(m[2],{}):0.08*(plot.t1-plot.t0);
  if(ts.some(t=>!(t>=plot.t0&&t<=plot.t1)))throw new Error("Tap: the time is outside the graph's t range");
  return{ts,tol};
}
function parseNotes(txt){
  const errs=[],sum={},items=[],eqs={};
  const lines=txt.replace(/\r/g,"").split("\n");
  let blk=null,key=null;
  const choices=(blk,L)=>{
    const letters=Object.keys(blk.opts);
    const ans=(blk.f["answer"]||"").trim().toUpperCase().replace(/[^A-F]/g,"");
    if(letters.length<2)throw new Error("needs at least two choices like A) and B)");
    if(!ans||!blk.opts[ans])throw new Error(`"Answer:" should be one of the letters ${letters.join(", ")}`);
    return{o:letters.map(k=>blk.opts[k]),c:letters.indexOf(ans)};
  };
  const finish=()=>{if(!blk)return;
    const f=blk.f,L=blk.line,T=blk.type;
    try{
      if(T==="EQUATIONS"){
        if(!blk.sec)throw new Error("EQUATIONS needs a section number, like ## EQUATIONS 3.4");
        if(!SECS.includes(blk.sec))throw new Error(`section ${blk.sec} isn't part of this chapter`);
        (eqs[blk.sec]=eqs[blk.sec]||[]).push(...blk.eqs);
      }else if(T==="SUMMARY"){
        if(!blk.sec)throw new Error("SUMMARY needs a section number, like ## SUMMARY 3.4");
        if(!f["in short"])throw new Error(`SUMMARY ${blk.sec} has no "In short:" line`);
        sum[blk.sec]={s:f["in short"],w:f["watch out"]||""};
      }else{
        if(!blk.sec)throw new Error(`${T} needs a section number, like ## ${T} 3.4`);
        if(!SECS.includes(blk.sec))throw new Error(`section ${blk.sec} isn't part of this chapter`);
        if(!f.q)throw new Error(`${T} has no "Q:" line`);
        const base={id:hashStr(T+blk.sec+f.q),type:T,sec:blk.sec,q:f.q,why:f["why"]||"",line:L};
        if(T==="QUIZ"){items.push({...base,...choices(blk,L)});}
        else if(T==="GRAPH"){
          const plot=parsePlot(f["plot"]);
          if(f["tap"])items.push({...base,plot,tap:parseTap(f["tap"],plot)});
          else items.push({...base,plot,...choices(blk,L)});
        }else if(T==="DRILL"){
          if(!f["answer"])throw new Error('DRILL has no "Answer:" line');
          const wrong=(blk.wrong||[]).map(w=>{const i=w.indexOf("|");return i<0?{f:w.trim(),fb:""}:{f:w.slice(0,i).trim(),fb:w.slice(i+1).trim()};});
          const d={...base,let:f["let"]||"",answer:f["answer"],wrong,u:f["unit"]||"",work:f["work"]||""};
          for(let k=0;k<6;k++)makeDrill(d);
          items.push(d);
        }
      }
    }catch(e){errs.push(`Line ${L}: ${T} problem: ${e.message}`);}
    blk=null;key=null;};
  lines.forEach((raw,i)=>{
    const n=i+1,line=raw.trimEnd();
    if(/^##/.test(line)){finish();
      const m=line.replace(/^##\s*/,"").match(/^(SUMMARY|EQUATIONS|QUIZ|DRILL|GRAPH)\b\s*([0-9]+\.[0-9]+)?/i);
      if(!m){errs.push(`Line ${n}: "${line}" isn't a known block. Use ## SUMMARY, ## EQUATIONS, ## QUIZ, ## DRILL, or ## GRAPH`);return;}
      blk={type:m[1].toUpperCase(),sec:m[2]||"",f:{},opts:{},wrong:[],eqs:[],line:n};return;}
    if(/^#/.test(line)||!blk)return;
    if(!line.trim()){key=null;return;}
    if(blk.type==="EQUATIONS"){
      const e=line.match(/^\s*(\*)?\s*(.*?)\s*\\\((.*)\\\)\s*$/);
      if(!e)errs.push(`Line ${n}: an equation line looks like  Name: \\(math\\)  with a * in front to put it on the equation sheet`);
      else blk.eqs.push({name:e[2].replace(/:\s*$/,"").trim(),tex:e[3].trim(),sheet:!!e[1],sec:blk.sec,line:n});
      return;}
    const opt=line.match(/^\s*([A-Fa-f])\)\s*(.*)$/);
    if((blk.type==="QUIZ"||blk.type==="GRAPH")&&opt){key="opt:"+opt[1].toUpperCase();blk.opts[opt[1].toUpperCase()]=opt[2];return;}
    const kv=line.match(/^\s*(Q|In short|Watch out|Answer|Why|Let|Unit|Work|Wrong|Plot|Tap)\s*:\s*(.*)$/i);
    if(kv){key=kv[1].toLowerCase();if(key==="wrong")blk.wrong.push(kv[2]);else blk.f[key]=kv[2];return;}
    if(key&&key.startsWith("opt:")){blk.opts[key.slice(4)]+=" "+line.trim();return;}
    if(key==="wrong"){blk.wrong[blk.wrong.length-1]+=" "+line.trim();return;}
    if(key){blk.f[key]+=" "+line.trim();return;}
    errs.push(`Line ${n}: this line doesn't start with a label like Q:, Why:, or A)`);
  });
  finish();
  return{sum,items,errs,eqs};
}

/* small, safe formula evaluator: + - * / ^ ( ) and a few functions */
const FN={sqrt:Math.sqrt,abs:Math.abs,sin:Math.sin,cos:Math.cos,tan:Math.tan,asin:Math.asin,acos:Math.acos,atan:Math.atan,ln:Math.log,log:Math.log10,exp:Math.exp};
function evalExpr(src,vars){
  const toks=String(src).replace(/−/g,"-").match(/\d*\.?\d+(?:e[+-]?\d+)?|[A-Za-z_]\w*|[-+*/^(),]|\S/gi)||[];
  let p=0;
  const peek=()=>toks[p],take=()=>toks[p++];
  const expect=t=>{if(take()!==t)throw new Error(`expected "${t}" in ${src}`);};
  function expr(){let v=term();while(peek()==="+"||peek()==="-"){const o=take(),r=term();v=o==="+"?v+r:v-r;}return v;}
  function term(){let v=unary();while(peek()==="*"||peek()==="/"){const o=take(),r=unary();v=o==="*"?v*r:v/r;}return v;}
  function unary(){if(peek()==="-"){take();return -unary();}if(peek()==="+"){take();return unary();}return power();}
  function power(){const b=atom();if(peek()==="^"){take();return Math.pow(b,unary());}return b;}
  function atom(){const t=take();
    if(t===undefined)throw new Error(`formula ended early: ${src}`);
    if(/^\d|^\./.test(t))return parseFloat(t);
    if(t==="("){const v=expr();expect(")");return v;}
    if(/^[A-Za-z_]/.test(t)){
      if(t==="pi")return Math.PI;
      if(FN[t]){expect("(");const v=expr();expect(")");return FN[t](v);}
      if(t in vars)return vars[t];
      throw new Error(`"${t}" isn't defined in Let:`);}
    throw new Error(`unexpected "${t}" in ${src}`);}
  const v=expr();if(p<toks.length)throw new Error(`unexpected "${toks[p]}" in ${src}`);return v;
}
const clean=x=>String(Math.round(x*1000)/1000);
function fmtNum(x,tex){if(Math.abs(x)<1e-9)return "0";let s=String(Number(x.toPrecision(3)));return tex?s:s.replace("-","−");}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function drawVars(d){
  const vars={};
  for(const part of d.let.split(";").map(s=>s.trim()).filter(Boolean)){
    const m=part.match(/^([A-Za-z_]\w*)\s*=\s*(.+)$/);
    if(!m)throw new Error(`Let: "${part}" should look like a = 1 to 5 by 0.5`);
    const list=m[2].match(/^one\s+of\s+(.+)$/i);
    const rng=m[2].match(/^(.+?)\s+to\s+(.+?)(?:\s+by\s+(.+))?$/i);
    if(list){const opts=list[1].split(",").map(x=>evalExpr(x,vars));vars[m[1]]=opts[Math.floor(Math.random()*opts.length)];}
    else if(rng){const lo=evalExpr(rng[1],vars),hi=evalExpr(rng[2],vars),st=rng[3]?evalExpr(rng[3],vars):1;
      if(!(st>0)||hi<lo)throw new Error(`Let: "${part}" needs a positive step and a range from low to high`);
      vars[m[1]]=Math.round((lo+Math.floor(Math.random()*(Math.round((hi-lo)/st)+1))*st)*1000)/1000;}
    else vars[m[1]]=evalExpr(m[2],vars);
  }
  return vars;
}
function makeDrill(d){
  let vars,ans,wr;
  for(let k=0;k<40;k++){
    vars=drawVars(d);ans=evalExpr(d.answer,vars);
    if(!isFinite(ans)){if(k===39)throw new Error("the answer is not a number for some values");continue;}
    wr=d.wrong.length?d.wrong.map(w=>({v:evalExpr(w.f,vars),fb:w.fb})):[{v:ans*2,fb:"Check for a missing or extra factor of 2."},{v:ans/2,fb:"Check for a missing or extra factor of 2."},{v:-ans,fb:"Check the sign."}];
    wr=wr.filter(w=>isFinite(w.v));
    const texts=[ans,...wr.map(w=>w.v)].map(x=>fmtNum(x));
    if(new Set(texts).size===texts.length)break;
  }
  const unit=d.u?" "+d.u:"";
  const seen=new Set([fmtNum(ans)]);
  const choices=[{t:fmtNum(ans)+unit,ok:true,fb:""}];
  for(const w of wr){const s=fmtNum(w.v);if(seen.has(s))continue;seen.add(s);choices.push({t:s+unit,ok:false,fb:w.fb});}
  if(choices.length<2)throw new Error("every wrong answer came out equal to the right one");
  const fill=s=>s.replace(/\{\{\s*(\w+)\s*\}\}/g,(_,k)=>k==="answer"?fmtNum(ans,true):(k in vars?clean(vars[k]):"?"));
  return{q:fill(d.q),choices:shuffle(choices),work:d.work?fill(d.work):""};
}

/* ---------- progress and spaced review (saved on this device only) ---------- */
/* ---------- settings.txt and schedule.txt: both optional, both yours to edit ---------- */
const CFG={perReview:5,toBloom:15,perDay:0,showDates:true,year:new Date().getFullYear()};
let CFG_ERRS=[],SCHED={},HAVE_SETTINGS=false,HAVE_SCHED=false,CFG_BASE=null;
const CHSET={};/* settings that apply to one chapter only, from "Chapter N" lines in settings.txt */
function applyChCfg(){if(!CFG_BASE)CFG_BASE={...CFG};Object.assign(CFG,CFG_BASE,CHSET[CH]||{});}
function bloomFor(n){return ((CHSET[n]||{}).toBloom)||(CFG_BASE||CFG).toBloom;}
const SETTING_KEYS={"questions per review":["perReview",1,50],"right answers to grow a flower":["toBloom",1,500],"reviews per day":["perDay",0,100]};
function parseSettings(txt){
  let cur=null;/* null means every chapter */
  const put=(key,val)=>{if(cur==null)CFG[key]=val;else (CHSET[cur]=CHSET[cur]||{})[key]=val;};
  const now=key=>cur!=null&&CHSET[cur]&&key in CHSET[cur]?CHSET[cur][key]:CFG[key];
  txt.replace(/\r/g,"").split("\n").forEach((raw,i)=>{
    const line=raw.replace(/#.*$/,"").trim();if(!line)return;
    const ch=line.match(/^ch(?:apter|\.)?\s*(\d+)$/i);
    if(ch){const n=+ch[1];if(!CHAPTERS.some(c=>c[0]===n)){CFG_ERRS.push(`settings.txt line ${i+1}: there is no Chapter ${n}, so the lines below it are skipped until the next chapter line`);cur=-1;}else cur=n;return;}
    if(/^every\s*chapter$/i.test(line)){cur=null;return;}
    const m=line.match(/^([^:]+):\s*(.*)$/);
    if(!m){CFG_ERRS.push(`settings.txt line ${i+1}: should look like "Questions per review: 5" or "Chapter 4"`);return;}
    if(cur===-1)return;
    const name=m[1].trim(),k=name.toLowerCase(),v=m[2].trim();
    if(k==="show class dates"){if(/^(yes|no)$/i.test(v))put("showDates",/^yes$/i.test(v));else CFG_ERRS.push(`settings.txt line ${i+1}: Show class dates should be yes or no`);return;}
    const spec=SETTING_KEYS[k];
    if(!spec){CFG_ERRS.push(`settings.txt line ${i+1}: "${name}" isn't a setting the app knows`);return;}
    const n=Number(v);
    if(v===""||!Number.isInteger(n)||n<spec[1]||n>spec[2]){CFG_ERRS.push(`settings.txt line ${i+1}: ${name} should be a whole number from ${spec[1]} to ${spec[2]}, so the app is using ${now(spec[0])}`);return;}
    put(spec[0],n);
  });
}
function parseSchedule(txt){
  const add=(k,d)=>{(SCHED[k]=SCHED[k]||[]).push(d);};
  txt.replace(/\r/g,"").split("\n").forEach((raw,i)=>{
    const line=raw.replace(/#.*$/,"").trim();if(!line)return;
    let m;
    if((m=line.match(/^year\s*:\s*(\d{4})$/i))){CFG.year=+m[1];return;}
    m=line.match(/^(\d{1,2})\/(\d{1,2})\s*:\s*(.+)$/);
    if(!m){CFG_ERRS.push(`schedule.txt line ${i+1}: should look like "1/29: 3.1, 3.2"`);return;}
    const d={mo:+m[1],dy:+m[2]};
    if(d.mo<1||d.mo>12||d.dy<1||d.dy>31){CFG_ERRS.push(`schedule.txt line ${i+1}: ${m[1]}/${m[2]} isn't a real date`);return;}
    for(const part of m[3].split(",").map(s=>s.trim()).filter(Boolean)){
      let r;
      if((r=part.match(/^ch(?:apter)?\.?\s*(\d+)$/i)))add("ch"+(+r[1]),d);
      else if((r=part.match(/^(\d+)\.(\d+)\s+to\s+(?:(\d+)\.)?(\d+)$/i))){
        if(r[3]&&r[3]!==r[1]){CFG_ERRS.push(`schedule.txt line ${i+1}: "${part}" should stay inside one chapter`);continue;}
        const a=+r[2],b=+r[4];if(b<a){CFG_ERRS.push(`schedule.txt line ${i+1}: "${part}" should go from low to high`);continue;}
        for(let k=a;k<=b;k++)add(r[1]+"."+k,d);}
      else if((r=part.match(/^(\d+)\.(\d+)$/)))add(+r[1]+"."+(+r[2]),d);
      else CFG_ERRS.push(`schedule.txt line ${i+1}: "${part}" should be a section like 3.1, a range like 3.3 to 3.6, or a chapter like Ch. 1`);
    }
  });
}
const WD=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
function classDates(sec){
  if(!CFG.showDates)return "";
  const l=SCHED[sec]||SCHED["ch"+sec.split(".")[0]];if(!l)return "";
  return l.map(d=>`${WD[new Date(CFG.year,d.mo-1,d.dy).getDay()]} ${d.mo}/${d.dy}`).join(" and ");
}

/* ---------- progress and growth (saved on this device only) ---------- */
/* each chapter keeps its own garden: fb:progress-ch3, fb:progress-ch4, and so on */
let PKEY="progress-ch3";const GAP=[0,1,3,7,14],BLOOM=1;
let DAY_OFF=0;
function loadProg(){const p=store(PKEY);return Object.assign({v:2,items:{},missions:{},preview:false,grow:{},days:{}},(p&&typeof p==="object"&&p.items)?p:{});}
let PROG=loadProg();/* replaced when a chapter loads */
function saveProg(){store(PKEY,PROG);}
function today(){const d=new Date();return Math.floor((d.getTime()-d.getTimezoneOffset()*6e4)/864e5)+DAY_OFF;}
function secItems(sec){return ITEMS.filter(i=>i.sec===sec);}
function secCount(sec){return Math.min(CFG.toBloom,(PROG.grow||{})[sec]||0);}
function secFrac(sec){if(PROG.preview)return 1;return Math.min(1,secCount(sec)/CFG.toBloom);}
function isDue(it,t){const r=PROG.items[it.id];return !!r&&r.due<=t;}
/* A question with fixed choices grows a plant once a day. A drill draws new numbers every time, so it counts every time. */
function canGrow(it,t){const r=PROG.items[it.id];return it.type==="DRILL"||!r||r.lastRight!==t;}
function reviewsToday(){return (PROG.days||{})[today()]||0;}
function dayCapped(){return CFG.perDay>0&&reviewsToday()>=CFG.perDay;}
function record(it,ok){
  const t=today();let r=PROG.items[it.id];
  const grows=ok&&canGrow(it,t);
  if(!r)r=PROG.items[it.id]={box:0,due:t,last:-1,n:0};
  r.n++;
  if(ok){
    if(r.box===0||r.due<=t){r.box=Math.min(GAP.length-1,r.box+1);r.due=t+GAP[r.box];}
    if(grows){PROG.grow=PROG.grow||{};PROG.grow[it.sec]=(PROG.grow[it.sec]||0)+1;r.lastRight=t;}
    delete r.miss;
  }else{r.box=Math.min(r.box,1);r.due=t;r.miss=true;}/* a miss can come back in the very next review */
  r.last=t;saveProg();
}
/* A random pick of the questions that can still grow the plant today. Missed questions are about twice as
   likely to be picked as a new one, and questions due for spaced review a bit more likely, but none is certain,
   so other questions still come up in between. The order is shuffled. */
const W_MISS=2,W_DUE=1.5;
function queueFor(sec){
  const t=today(),pool=ITEMS.filter(i=>(!sec||i.sec===sec)&&canGrow(i,t));
  const w=i=>{const r=PROG.items[i.id];return !r?1:r.miss?W_MISS:r.due<=t?W_DUE:1;};

/* ---------- calculator ----------
   A small parser of its own (never eval). Expressions use the same symbols shown on the keys:
   + − × ÷ ^ ² ⁻¹ √ π e ( ) sin cos tan sin⁻¹ cos⁻¹ tan⁻¹ ln log Ans.
   A number written as 6.67×10^−11 is read as ONE number, like the EE key on a handheld calculator,
   so 1÷2×10^3 is 1 divided by 2000. Missing closing parentheses are added at the end. */
const CALC={deg:true,inv:false,ans:0,hist:[],panel:"keys",expr:"",pos:0,shown:null};
(function(){const s=store("calc");if(s){CALC.deg=s.deg!==false;CALC.ans=+s.ans||0;CALC.hist=Array.isArray(s.hist)?s.hist.slice(0,20):[];if(typeof s.expr==="string"){CALC.expr=s.expr;CALC.pos=s.expr.length;}}})();
function saveCalc(){store("calc",{deg:CALC.deg,ans:CALC.ans,hist:CALC.hist,expr:CALC.expr});}
function calcErr(m){const e=new Error(m);e.calc=true;return e;}
const SUP={"⁰":"0","¹":"1","²":"2","³":"3","⁴":"4","⁵":"5","⁶":"6","⁷":"7","⁸":"8","⁹":"9","⁻":"-"};
function calcLex(src){
  const T=[];let i=0;const s=src;
  const isD=c=>c>="0"&&c<="9";
  while(i<s.length){
    const c=s[i];
    if(/\s/.test(c)){i++;continue;}
    if(isD(c)||(c==="."&&isD(s[i+1]||""))){
      let j=i;while(j<s.length&&(isD(s[j])||s[j]==="."))j++;
      const txt=s.slice(i,j);if((txt.match(/\./g)||[]).length>1)throw calcErr("A number has two decimal points.");
      let v=parseFloat(txt);
      /* scientific notation glued to the number: 3×10^8, 3*10^-8, 3E8, 3e-8 */
      let m=s.slice(j).match(/^\s*[×*xX]\s*10\s*\^\s*\(?\s*([−\-+]?)\s*(\d+(?:\.\d+)?)\s*(\)?)/);
      if(m&&(!m[0].includes("(")||m[3])){v=v*Math.pow(10,(m[1]==="−"||m[1]==="-"?-1:1)*parseFloat(m[2]));j+=m[0].length;}
      else if((m=s.slice(j).match(/^[eE]([−\-+]?)(\d+)/))){v=v*Math.pow(10,(m[1]==="−"||m[1]==="-"?-1:1)*parseInt(m[2]));j+=m[0].length;}
      T.push({t:"num",v});i=j;continue;
    }
    if(/[a-zA-Zπ√]/.test(c)){
      if(c==="π"){T.push({t:"num",v:Math.PI});i++;continue;}
      if(c==="√"){T.push({t:"fn",v:"sqrt"});i++;continue;}
      let j=i;while(j<s.length&&/[a-zA-Z]/.test(s[j]))j++;
      let w=s.slice(i,j).toLowerCase();
      if(s.slice(j,j+2)==="⁻¹"&&/^(sin|cos|tan)$/.test(w)){w="a"+w;j+=2;}
      const names={sin:"sin",cos:"cos",tan:"tan",asin:"asin",acos:"acos",atan:"atan",arcsin:"asin",arccos:"acos",arctan:"atan",ln:"ln",log:"log",sqrt:"sqrt"};
      if(names[w]){T.push({t:"fn",v:names[w]});i=j;continue;}
      if(w==="ans"){T.push({t:"num",v:CALC.ans,ans:true});i=j;continue;}
      if(w==="pi"){T.push({t:"num",v:Math.PI});i=j;continue;}
      if(w==="e"){T.push({t:"num",v:Math.E});i=j;continue;}
      throw calcErr(`“${s.slice(i,j)}” isn't something this calculator knows.`);
    }
    if(c==="²"||c==="³"){T.push({t:"post",v:c==="²"?2:3});i++;continue;}
    if(c==="⁻"&&s[i+1]==="¹"){T.push({t:"post",v:-1});i+=2;continue;}
    if(c in SUP){let j=i,e="";while(j<s.length&&s[j] in SUP){e+=SUP[s[j]];j++;}T.push({t:"op",v:"^"});T.push({t:"num",v:parseFloat(e)});i=j;continue;}
    const ops={"+":"+","-":"-","−":"-","–":"-","×":"*","*":"*","·":"*","÷":"/","/":"/","^":"^","(":"(",")":")","[":"(","]":")","!":"!"};
    if(ops[c]){T.push({t:"op",v:ops[c]});i++;continue;}
    throw calcErr(`“${c}” can't be used here.`);
  }
  return T;
}
function calcEval(src,deg){
  const T=calcLex(src);let i=0;
  const peek=()=>T[i],eat=()=>T[i++];
  const isOp=(t,v)=>t&&t.t==="op"&&t.v===v;
  const startsPrimary=t=>t&&(t.t==="num"||t.t==="fn"||isOp(t,"("));
  const toR=x=>deg?x*Math.PI/180:x, fromR=x=>deg?x*180/Math.PI:x;
  const snap=x=>Math.abs(x)<1e-12?0:x;
  function fn(name,x){
    switch(name){
      case "sin":return snap(Math.sin(toR(x)));
      case "cos":return snap(Math.cos(toR(x)));
      case "tan":{if(deg&&Math.abs(((x%180)+180)%180-90)<1e-9)throw calcErr(`tan of ${sig(x)}° is undefined.`);return snap(Math.tan(toR(x)));}
      case "asin":if(x<-1||x>1)throw calcErr("sin⁻¹ needs a value from −1 to 1.");return fromR(Math.asin(x));
      case "acos":if(x<-1||x>1)throw calcErr("cos⁻¹ needs a value from −1 to 1.");return fromR(Math.acos(x));
      case "atan":return fromR(Math.atan(x));
      case "ln":if(x<=0)throw calcErr("ln needs a positive number.");return Math.log(x);
      case "log":if(x<=0)throw calcErr("log needs a positive number.");return Math.log10(x);
      case "sqrt":if(x<0)throw calcErr("The square root of a negative number isn't a real number.");return Math.sqrt(x);
    }
  }
  function expr(){let v=term();for(;;){const t=peek();if(isOp(t,"+")){eat();v+=term();}else if(isOp(t,"-")){eat();v-=term();}else return v;}}
  function term(){let v=unary();for(;;){const t=peek();
    if(isOp(t,"*")){eat();v*=unary();}
    else if(isOp(t,"/")){eat();const d=unary();if(d===0)throw calcErr("Can't divide by zero.");v/=d;}
    else if(startsPrimary(t)){v*=power();}/* written side by side, like 2π or 3(4) */
    else return v;}}
  function unary(){const t=peek();if(isOp(t,"-")){eat();return -unary();}if(isOp(t,"+")){eat();return unary();}return power();}
  function power(){const b=postfix();if(isOp(peek(),"^")){eat();const e=unary();const r=Math.pow(b,e);if(Number.isNaN(r))throw calcErr("A negative number can't be raised to that power.");return r;}return b;}
  function postfix(){let v=primary();for(;;){const t=peek();
    if(t&&t.t==="post"){eat();if(t.v===-1&&v===0)throw calcErr("Can't divide by zero.");v=Math.pow(v,t.v);}
    else if(isOp(t,"!")){eat();if(v<0||v!==Math.floor(v)||v>170)throw calcErr("! needs a whole number from 0 to 170.");let f=1;for(let k=2;k<=v;k++)f*=k;v=f;}
    else return v;}}
  function primary(){
    const t=eat();
    if(!t)throw calcErr("The expression ends too soon.");
    if(t.t==="num")return t.v;
    if(t.t==="fn")return fn(t.v,unary());
    if(isOp(t,"(")){if(isOp(peek(),")"))throw calcErr("Empty parentheses.");const v=expr();if(isOp(peek(),")"))eat();else if(peek())throw calcErr("Check the parentheses.");return v;}
    if(isOp(t,")"))throw calcErr("There's a “)” without a matching “(”.");
    throw calcErr(`“${{"*":"×","/":"÷","^":"^","-":"−","+":"+","!":"!"}[t.v]||t.v}” needs a number before it.`);
  }
  if(!T.length)return null;
  const v=expr();
  if(i<T.length)throw calcErr(isOp(T[i],")")?"There's a “)” without a matching “(”.":"Check the expression near the end.");
  if(!isFinite(v))throw calcErr("The result is too big to show.");
  return v;
}
/* display: up to 10 significant figures, scientific notation for very big or very small numbers */
const SUPD={"0":"⁰","1":"¹","2":"²","3":"³","4":"⁴","5":"⁵","6":"⁶","7":"⁷","8":"⁸","9":"⁹","-":"⁻"};
function calcSci(m,e){return`${m.replace("-","−")} × 10${String(e).split("").map(ch=>SUPD[ch]).join("")}`;}
function calcFmt(x,p=10,keep=false){
  if(x===0)return"0";
  const [mm,ee]=x.toExponential(p-1).split("e"),e=+ee;
  const m=keep?mm:mm.replace(/(\.\d*?)0+$/,"$1").replace(/\.$/,"");
  if(e>=10||e<-4||(keep&&e>=p))return calcSci(m,e);
  return(keep?x.toPrecision(p):String(+x.toPrecision(p))).replace("-","−");
}
/* a constant as the book writes it, keeping its significant figures: 9.80, 1.000 × 10³ */
function calcShowTxt(t){const m=t.match(/^(.*)×10\^(−?\d+)$/);return m?calcSci(m[1],m[2].replace("−","-")):t;}
/* what gets typed back into the expression for a value (Ans, history, constants) */
function calcInsertText(x){
  if(x===0)return"0";
  const [mm,ee]=x.toExponential(9).split("e"),e=+ee;
  if(e>=10||e<-4)return`${mm.replace(/(\.\d*?)0+$/,"$1").replace(/\.$/,"").replace("-","−")}×10^${e<0?"−"+(-e):e}`;
  return String(+x.toPrecision(10)).replace("-","−");
}

  [["sin(","sin","Sine","fnk"],["cos(","cos","Cosine","fnk"],["tan(","tan","Tangent","fnk"],["ln(","ln","Natural log","fnk"],["log(","log","Log base 10","fnk"]],
  [["(","(","Open parenthesis"],[")",")","Close parenthesis"],["²","x²","Square"],["^","xʸ","Power"],["√(","√","Square root"]],
  [["7","7"],["8","8"],["9","9"],["bs","⌫","Backspace","op"],["ac","AC","Clear","op"]],
  [["4","4"],["5","5"],["6","6"],["×","×","Times","op"],["÷","÷","Divide","op"]],
  [["1","1"],["2","2"],["3","3"],["+","+","Plus","op"],["−","−","Minus","op"]],
  [["0","0"],[".",".","Decimal point"],["×10^","×10ⁿ","Times ten to the power","sci"],["Ans","Ans","Last answer"],["=","=","Equals","eq"]]];
const INVK={"sin(":["sin⁻¹(","sin⁻¹"],"cos(":["cos⁻¹(","cos⁻¹"],"tan(":["tan⁻¹(","tan⁻¹"],"ln(":["e^(","eˣ"],"log(":["10^(","10ˣ"]};
function renderCalc(){
  crumb.textContent="Calculator";
  main.innerHTML=`
  <header class="calchead"><div><div class="eyebrow">SI units only</div><h1>Calculator</h1></div>
    <div class="seg angseg" role="group" aria-label="Angle unit"><button type="button" data-ang="deg" aria-pressed="${CALC.deg}">DEG</button><button type="button" data-ang="rad" aria-pressed="${!CALC.deg}">RAD</button></div></header>
  <section class="calcbox" aria-label="Calculator">
    <div class="calcdisp">
      <input id="cx" class="cx" type="text" inputmode="none" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Expression" placeholder="0" value="${esc(CALC.expr)}">
      <div class="cres" id="cres" aria-live="polite"></div>
    </div>
    <div class="prefixes" role="group" aria-label="SI prefixes">
      ${PREFIX.map(([s,n,w])=>`<button type="button" class="pk" data-pre="${n}" aria-label="${w}, times ten to the ${n}" title="${w} ×10${String(n).split("").map(c=>SUPD[c]).join("")}">${s}</button>`).join("")}
    </div>
    <div class="seg calcseg" role="group" aria-label="Show">
      <button type="button" data-panel="keys" aria-pressed="true">Keys</button><button type="button" data-panel="consts" aria-pressed="false">Constants</button><button type="button" data-panel="hist" aria-pressed="false">History</button></div>
    <div id="cpanel"></div>
  </section>
  <p class="small muted">Values of the constants are from OpenStax <a href="https://openstax.org/details/books/university-physics-volume-1" target="_blank" rel="noopener">University Physics Volume 1</a> (Appendices B and D, Sections 13.2 and 14.1).</p>`;
  const cx=document.getElementById("cx");
  CALC.pos=Math.min(CALC.pos||CALC.expr.length,CALC.expr.length);
  const keepPos=()=>{CALC.pos=cx.selectionStart??cx.value.length;};
  ["keyup","click","select","focus"].forEach(ev=>cx.addEventListener(ev,keepPos));
  cx.addEventListener("input",()=>{
    const p=cx.selectionStart;const v=cx.value.replace(/\*/g,"×").replace(/\//g,"÷").replace(/-/g,"−");
    if(v!==cx.value){cx.value=v;cx.setSelectionRange(p,p);}
    CALC.expr=cx.value;CALC.shown=null;keepPos();calcPreview();});
  cx.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key==="="){e.preventDefault();calcEquals();}else if(e.key==="Escape"){e.preventDefault();calcPress("ac");}});
  main.querySelectorAll("[data-ang]").forEach(b=>b.onclick=()=>{CALC.deg=b.dataset.ang==="deg";saveCalc();main.querySelectorAll("[data-ang]").forEach(x=>x.setAttribute("aria-pressed",x.dataset.ang===(CALC.deg?"deg":"rad")));calcDrawKeys();calcPreview();});
  main.querySelectorAll("[data-pre]").forEach(b=>b.onclick=()=>{const n=+b.dataset.pre,e=n<0?"−"+(-n):String(n);
    /* glued to a number it reads as 4.5×10^3; with nothing before it, as 10^3 */
    const before=CALC.expr.slice(0,Math.min(CALC.pos,CALC.expr.length));
    calcInsert(CALC.shown!==null||/[0-9.)πe²³¹s]$/.test(before)?"×10^"+e:"10^"+e);});
  main.querySelectorAll("[data-panel]").forEach(b=>b.onclick=()=>calcPanel(b.dataset.panel));
  calcPanel(CALC.panel||"keys");calcPreview();
}
function calcPanel(p){
  CALC.panel=p;
  main.querySelectorAll("[data-panel]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.panel===p));
  const el=document.getElementById("cpanel");
  if(p==="keys"){el.innerHTML=`<div class="keypad" id="keypad"></div>`;calcDrawKeys();return;}
  if(p==="consts"){
    el.innerHTML=`<p class="small muted cpnote">Tap a constant to put its value in the expression.</p><div class="clist">${CONSTS.map((c,i)=>`<button type="button" class="crow" data-c="${i}">
      <span class="sym">${c.tex||esc(c.k)}</span><span class="cname">${esc(c.name)}${c.note?`<span class="cnote">${esc(c.note)}</span>`:""}</span>
      <span class="cval">${calcShowTxt(c.txt)} <span class="u">${esc(c.unit)}</span></span></button>`).join("")}</div>`;
    el.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{calcInsert(CONSTS[+b.dataset.c].txt);calcPanel("keys");});
    return;
  }
  el.innerHTML=CALC.hist.length?`<p class="small muted cpnote">Tap a result to use it again.</p><div class="clist">${CALC.hist.map((h,i)=>`<button type="button" class="crow hrow" data-h="${i}">
      <span class="hx">${esc(h.x)}</span><span class="cval">= ${calcFmt(h.v)}</span></button>`).join("")}</div>
      <button type="button" class="linkbtn" id="hclear">Clear history</button>`:`<p class="small muted cpnote">Results you work out show up here.</p>`;
  el.querySelectorAll("[data-h]").forEach(b=>b.onclick=()=>{calcInsert(calcInsertText(CALC.hist[+b.dataset.h].v));calcPanel("keys");});
  const hc=document.getElementById("hclear");if(hc)hc.onclick=()=>{CALC.hist=[];saveCalc();calcPanel("hist");};
}
function calcDrawKeys(){
  const kp=document.getElementById("keypad");if(!kp)return;
  kp.innerHTML=KEYS.flat().map(([k,l,a,cls])=>{
    let key=k,lab=l;
    if(CALC.inv&&INVK[k]){key=INVK[k][0];lab=INVK[k][1];}
    if(k==="deg")lab=CALC.deg?"DEG":"RAD";
    const pressed=k==="inv"?` aria-pressed="${CALC.inv}"`:"";
    const al=k==="deg"?`Angles in ${CALC.deg?"degrees":"radians"}, tap to switch`:(CALC.inv&&INVK[k]?lab:a||l);
    return `<button type="button" class="key${cls?" "+cls:""}" data-k="${esc(key)}"${pressed} aria-label="${esc(al)}">${lab}</button>`;}).join("");
  kp.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>calcPress(b.dataset.k));
}
const CALC_TOKENS=["sin⁻¹(","cos⁻¹(","tan⁻¹(","sin(","cos(","tan(","ln(","log(","10^(","e^(","√(","Ans","×10^","⁻¹"];
function calcPress(k){
  const cx=document.getElementById("cx");
  if(k==="deg"){CALC.deg=!CALC.deg;saveCalc();main.querySelectorAll("[data-ang]").forEach(x=>x.setAttribute("aria-pressed",x.dataset.ang===(CALC.deg?"deg":"rad")));calcDrawKeys();calcPreview();return;}
  if(k==="inv"){CALC.inv=!CALC.inv;calcDrawKeys();return;}
  if(k==="ac"){CALC.expr="";CALC.pos=0;CALC.shown=null;cx.value="";calcPreview();return;}
  if(k==="="){calcEquals();return;}
  if(k==="bs"){
    let p=CALC.pos,v=CALC.expr;if(p<=0)return;
    const t=CALC_TOKENS.find(t=>v.slice(0,p).endsWith(t));const n=t?t.length:1;
    CALC.expr=v.slice(0,p-n)+v.slice(p);CALC.pos=p-n;CALC.shown=null;cx.value=CALC.expr;cx.setSelectionRange(CALC.pos,CALC.pos);calcPreview();return;}
  /* after a result, an operator continues from it and a number starts over */
  if(CALC.shown!==null&&CALC.pos===CALC.expr.length){
    if(/^[×÷+−^²⁻]/.test(k)){CALC.expr="Ans";CALC.pos=3;}
    else{CALC.expr="";CALC.pos=0;}
    CALC.shown=null;cx.value=CALC.expr;
  }
  if(CALC.inv&&/[(]$/.test(k)){CALC.inv=false;calcDrawKeys();}
  calcInsert(k);
}
function calcInsert(t){
  const cx=document.getElementById("cx");if(!cx)return;
  if(CALC.shown!==null&&CALC.pos===CALC.expr.length){CALC.expr=/^×10\^/.test(t)?"Ans":"";CALC.pos=CALC.expr.length;}
  CALC.shown=null;
  const p=Math.min(CALC.pos,CALC.expr.length);
  CALC.expr=CALC.expr.slice(0,p)+t+CALC.expr.slice(p);CALC.pos=p+t.length;
  cx.value=CALC.expr;
  /* keep the phone keyboard closed while still showing the cursor spot */
  try{cx.setSelectionRange(CALC.pos,CALC.pos);}catch(e){}
  if(document.activeElement!==cx)cx.scrollLeft=cx.scrollWidth;
  calcPreview();
}
function calcResultHTML(v,big){
  const three=calcFmt(v,3,true),full=calcFmt(v);
  return `<div class="cval ${big?"big":""}">= ${full}</div>${three!==full&&v!==0?`<div class="c3">3 sig figs: ${three}</div>`:""}`;
}
function calcPreview(){
  const out=document.getElementById("cres");if(!out)return;
  if(CALC.shown!==null){out.innerHTML=calcResultHTML(CALC.shown,true)+`<div class="cmode">${CALC.deg?"Degrees":"Radians"}</div>`;return;}
  let v=null,err="";
  try{v=calcEval(CALC.expr,CALC.deg);}catch(e){if(e.calc)err=e.message;else err="Check the expression.";}
  out.innerHTML=(v!=null?calcResultHTML(v,false):err?`<div class="cerr">${esc(err)}</div>`:`<div class="c3">&nbsp;</div>`)+`<div class="cmode">${CALC.deg?"Degrees":"Radians"}</div>`;
}
function calcEquals(){
  const out=document.getElementById("cres");
  let v;try{v=calcEval(CALC.expr,CALC.deg);}catch(e){out.innerHTML=`<div class="cerr">${esc(e.calc?e.message:"Check the expression.")}</div><div class="cmode">${CALC.deg?"Degrees":"Radians"}</div>`;return;}
  if(v==null)return;
  /* close any parentheses left open so the history reads cleanly */
  const opens=(CALC.expr.match(/\(/g)||[]).length-(CALC.expr.match(/\)/g)||[]).length;
  const x=CALC.expr+(opens>0?")".repeat(opens):"");
  CALC.ans=v;
  if(!(CALC.hist[0]&&CALC.hist[0].x===x&&CALC.hist[0].v===v))CALC.hist.unshift({x,v});
  CALC.hist=CALC.hist.slice(0,20);saveCalc();
  CALC.expr=x;CALC.pos=x.length;CALC.shown=v;
  const cx=document.getElementById("cx");cx.value=x;
  calcPreview();
}

const PETALS=[5,6,8,5,6,10];
const PARTS=["launch pad","body","fins","engine","window","nose cone"];
const ease=x=>1-Math.pow(1-x,2);
function stageName(f){return f<=0?"Seed":f<0.2?"Sprout":f<0.4?"Growing":f<0.58?"Leafy":f<BLOOM?"Budding":"In bloom";}
function plantSVG(f,idx,label){
  f=Math.max(0,Math.min(1,f));
  const petal=`var(--petal-${idx%6+1})`, top=92;
  const H=f>0?12+60*ease(f):0, tipY=top-H, sway=(idx%2?1:-1)*4*ease(f);
  let g=`<path d="M22 92 L78 92 L72 118 L28 118 Z" fill="var(--pot)"/><rect x="18" y="86" width="64" height="8" rx="2" fill="var(--pot-shade)"/><ellipse cx="50" cy="90" rx="28" ry="3.2" fill="var(--soil)"/>`;
  if(f<=0){g+=`<ellipse cx="50" cy="88" rx="4" ry="2.6" fill="var(--soil-seed)"/>`;}
  else{
    const cx=50+sway;
    g+=`<path d="M50 ${top-1} Q${50-sway} ${top-H*0.55} ${cx} ${tipY}" fill="none" stroke="var(--stem)" stroke-width="${1.6+1.6*f}" stroke-linecap="round"/>`;
    const nLeaves=Math.min(6,Math.floor(f*7.5)+1);
    for(let k=0;k<nLeaves;k++){
      const s=(k+1)/(nLeaves+1.4), y=top-H*s, x=50+(cx-50)*s*s-((50-sway)-50)*2*s*(1-s)*-1;
      const side=k%2?1:-1, L=(6+9*f)*(1-0.25*s);
      g+=`<path d="M${x.toFixed(1)} ${y.toFixed(1)} q${(side*L*0.5).toFixed(1)} ${(-L*0.55).toFixed(1)} ${(side*L).toFixed(1)} ${(-L*0.15).toFixed(1)} q${(-side*L*0.45).toFixed(1)} ${(L*0.45).toFixed(1)} ${(-side*L).toFixed(1)} ${(L*0.15).toFixed(1)}Z" fill="${k%2?"var(--leaf)":"var(--leaf2)"}"/>`;
    }
    if(f>=0.58&&f<BLOOM){const r=3+5*(f-0.58)/(1-0.58);g+=`<ellipse cx="${cx}" cy="${tipY-r*0.6}" rx="${r*0.75}" ry="${r}" fill="${petal}" opacity=".85"/><path d="M${cx-r*0.75} ${tipY} q${r*0.75} ${-r*0.9} ${r*1.5} 0" fill="var(--leaf2)"/>`;}
    if(f>=BLOOM){const n=PETALS[idx%PETALS.length],R=14,cy=tipY-R*0.5;
      for(let k=0;k<n;k++){const a=k*360/n;g+=`<ellipse cx="${cx}" cy="${cy-R*0.55}" rx="${R*0.32}" ry="${R*0.6}" fill="${petal}" transform="rotate(${a} ${cx} ${cy})"/>`;}
      g+=`<circle cx="${cx}" cy="${cy}" r="${R*0.32}" fill="var(--center)"/>`;}
  }
  return `<svg viewBox="0 0 100 120" role="img" aria-label="${esc(label)}">${g}</svg>`;
}

    ready:"Your sailboat is ready",readyText:"Set a course with vectors and sail it to the island.",go:"Go to the harbor",
    count:(n,t)=>`${n} of ${t} sailboat parts`,wait:"Each plant that blooms adds a part. When all four bloom, you can sail it to the island."},
  catapult:{eyebrow:"The castle field",thing:"catapult",parts:["base and wheels","frame","throwing arm","bucket","counterweight"],svg:catSVG,route:"fire",

const toy=()=>TOYS[chx().toy]||null;

/* ---------- review: garden home, sessions, summary ---------- */
let SESS=null, GSEL=-1;
/* an unfinished session is saved on this device, so a student can stop and come back later to the same question */
let SKEY="session-ch3";
function saveSess(){if(!SESS||SESS.done){store(SKEY,null);return;}
  store(SKEY,Object.assign({},SESS,{queue:SESS.queue.map(q=>Object.assign({},q,{it:undefined,id:q.it.id}))}));}
function loadSess(){
  const s=store(SKEY);if(!s||!Array.isArray(s.queue)||s.done)return null;
  const byId={};ITEMS.forEach(i=>byId[i.id]=i);
  /* older builds added a retry at the end for each miss; drop any not yet answered */
  const queue=s.queue.filter(q=>byId[q.id]&&!(q.retry&&!q.answered)).map(q=>{const c=Object.assign({},q,{it:byId[q.id]});delete c.id;return c;});
  let i=s.i;
  if(queue.length!==s.queue.length)i=queue.findIndex(q=>!q.answered);
  if(!queue.length||i<0||i>=queue.length)return null;
  return Object.assign(s,{queue,i,paused:true});
}
function pausedSess(){return SESS&&!SESS.done&&SESS.paused?SESS:null;}
function resumeLabel(P){return P.practice?"Keep practicing":`Keep growing ${P.sec}`;}
function resumeSess(){SESS.paused=false;saveSess();GSEL=-1;
  if(location.hash===H("review")){renderSession();typeset(main);window.scrollTo(0,0);}else location.hash=H("review");}
function renderPaused(){

function secTitle(sec){const s=S.find(x=>x.num===sec);return s?s.title:"";}
function bloomed(){return SECS.map(s=>secFrac(s)>=BLOOM);}
const plural=(n,w)=>`${n} ${w}${n===1?"":"s"}`;
function startCard(){

function howGrow(){

function renderGarden(){

function potDetail(i){
  const s=SECS[i],l=secItems(s),t=today();
  const fresh=l.filter(it=>!PROG.items[it.id]).length;
  const P=pausedSess(),mine=P&&P.sec===s;

    <div class="eyebrow">Section ${s}</div><h2>${esc(secTitle(s))}</h2>

    <div class="row">

function wireBackup(){
  const out=document.getElementById("bk-out");if(!out)return;
  const code=backupCode();
  out.value=code;
  const msg=document.getElementById("bk-msg");
  document.getElementById("bk-copy").onclick=()=>{

/* One backup code holds every chapter. FB1 codes came from the first version, which only had Chapter 3. */
function backupCode(){
  const all={};for(const [n] of CHAPTERS){const p=store("progress-ch"+n);if(p&&p.items)all[n]=p;}
  try{return "FB2:"+btoa(unescape(encodeURIComponent(JSON.stringify({v:2,ch:all}))));}catch(e){return "";}
}
function readBackup(raw){
  try{
    const m=raw.replace(/\s+/g,"").match(/^FB([12]):(.+)$/);if(!m)return null;
    const p=JSON.parse(decodeURIComponent(escape(atob(m[2]))));
    if(m[1]==="1")return p&&p.items?{3:p}:null;
    if(!p||!p.ch||typeof p.ch!=="object")return null;
    const out={};for(const k of Object.keys(p.ch)){const n=+k;if(CHAPTERS.some(c=>c[0]===n)&&p.ch[k]&&p.ch[k].items)out[n]=p.ch[k];}
    return Object.keys(out).length?out:null;
  }catch(e){return null;}
}
function startSession(sec,practice){
  const P=pausedSess();
  if(P&&P.sec===sec&&!!P.practice===!!practice)return resumeSess();
  if(!practice&&dayCapped())practice=true;
  let items=practice?shuffle(ITEMS.filter(i=>!sec||i.sec===sec)).slice(0,CFG.perReview):queueFor(sec);
  if(!items.length){items=shuffle(ITEMS.filter(i=>!sec||i.sec===sec)).slice(0,CFG.perReview);practice=true;}
  const before={};SECS.forEach(s=>before[s]=secFrac(s));
  SESS={queue:items.map(it=>({it})),i:0,first:0,firstN:0,practice,sec,before,done:false};
  saveSess();
  GSEL=-1;
  if(location.hash===H("review")){renderSession();typeset(main);window.scrollTo(0,0);}else location.hash=H("review");
}
function renderSession(){
  const Ss=SESS;
  crumb.textContent=Ss.practice?"Practice":"Review";
  if(Ss.i>=Ss.queue.length)return renderSummary();
  const q=Ss.queue[Ss.i],it=q.it;
  if(it.type==="DRILL"&&!q.inst){try{q.inst=makeDrill(it);}catch(e){Ss.i++;return renderSession();}}
  const prompt=it.type==="DRILL"?q.inst.q:it.q;
  let choices="";
  if(it.type==="DRILL")choices=q.inst.choices.map((c,j)=>optBtn(q,j,c.t,c.ok)).join("");
  else if(!it.tap)choices=it.o.map((o,j)=>optBtn(q,j,o,j===it.c)).join("");
  main.innerHTML=`
  <div class="sesshead">
    <div class="dots" aria-label="Item ${Ss.i+1} of ${Ss.queue.length}">${Ss.queue.map((x,j)=>`<span class="dot${j<Ss.i?(x.ok?" ok":" no"):j===Ss.i?" cur":""}"></span>`).join("")}</div>
    <button class="linkbtn" id="quit">End</button>
  </div>
  <article class="card stack qcard">
    <div class="probhead"><span>${it.sec} ${esc(secTitle(it.sec))}</span><span>${q.retry?"Try again":Ss.practice?"Practice":""}</span></div>
    <p class="qtext">${esc(prompt)}</p>
    ${it.plot?graphSVG(it,q):""}
    ${it.tap&&!q.answered?`<p class="small muted">Tap the graph, then check your answer.</p>`:""}
    ${choices?`<div class="opts">${choices}</div>`:""}
    ${q.answered?"":`<div id="checkwrap"></div>`}
    <div id="fb">${q.answered?feedback(q):""}</div>
  </article>
  ${q.answered?`<div class="nextbar"><button class="btn big" id="next">${Ss.i+1<Ss.queue.length?"Next":"Finish"}</button></div>`:""}`;
  document.getElementById("quit").onclick=()=>{Ss.paused=true;saveSess();renderPaused();typeset(main);window.scrollTo(0,0);};
  /* a tap only selects; the answer counts when the student presses Check answer */
  const showCheck=()=>{const w=document.getElementById("checkwrap");if(!w||w.firstChild)return;
    w.innerHTML=`<button class="btn big checkbtn" id="check">Check answer</button>`;
    document.getElementById("check").onclick=()=>{if(q.answered)return;
      if(it.tap){if(q.tapT==null)return;answer(q,it.tap.ts.some(x=>Math.abs(x-q.tapT)<=it.tap.tol));}
      else{if(q.sel==null)return;const b=main.querySelector(`.opt[data-j="${q.sel}"]`);q.pick=q.sel;answer(q,!!b&&b.dataset.ok==="1");}};};
  main.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(q.answered)return;q.sel=+b.dataset.j;
    main.querySelectorAll(".opt").forEach(o=>{const on=o===b;o.classList.toggle("chosen",on);o.setAttribute("aria-pressed",on?"true":"false");});
    showCheck();});
  if(it.tap&&!q.answered)wireTap(it,q,showCheck);
  if(!q.answered&&(it.tap?q.tapT!=null:q.sel!=null))showCheck();
  const nx=document.getElementById("next");if(nx){nx.onclick=()=>{Ss.i++;saveSess();renderSession();typeset(main);window.scrollTo(0,0);};nx.focus({preventScroll:true});}
}
function optBtn(q,j,text,ok){
  let cls="opt";
  if(q.answered){if(ok)cls+=" right";else if(q.pick===j)cls+=" wrong";}
  else if(q.sel===j)cls+=" chosen";
  return `<button class="${cls}" data-j="${j}" data-ok="${ok?1:0}" ${q.answered?"disabled":""}>${esc(text)}</button>`;
}
function answer(q,ok){
  const Ss=SESS;q.answered=true;q.ok=ok;
  if(!q.retry){Ss.firstN++;if(ok)Ss.first++;if(!Ss.practice)record(q.it,ok);}
  saveSess();
  renderSession();typeset(main);
  const fb=document.getElementById("fb");if(fb&&fb.scrollIntoView)fb.scrollIntoView({block:"nearest",behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});
}
function feedback(q){
  const it=q.it;let extra="";
  if(it.type==="DRILL"&&!q.ok){const c=q.inst.choices[q.pick];if(c&&c.fb)extra=`<p>${esc(c.fb)}</p>`;}
  const work=it.type==="DRILL"&&q.inst.work?`<div class="eqbox">\\[${q.inst.work}\\]</div>`:"";
  const why=it.why?`<p>${esc(it.why)}</p>`:"";
  const head=q.ok?(q.retry?"Got it this time":"Correct"):(SESS&&SESS.practice?"Not quite.":"Not quite. This one will come back soon for another try.");
  return `<div class="fb ${q.ok?"good":"bad"}"><b>${head}</b>${extra}${why}${work}</div>`;
}

/* graph items */
function graphSVG(it,q){
  const p=it.plot,W=320,H=214,L=44,R=308,T=24,B=184;
  const X=t=>L+(t-p.t0)/(p.t1-p.t0)*(R-L), Y=y=>B-(y-p.y0)/(p.y1-p.y0)*(B-T);
  const step=(lo,hi)=>{const span=hi-lo;for(const s of [0.5,1,2,5,10,20,25,50,100])if(span/s<=7)return s;return span/5;};
  const ts=step(p.t0,p.t1),ys=step(p.y0,p.y1);
  let g="";
  for(let y=Math.ceil(p.y0/ys)*ys;y<=p.y1+1e-9;y+=ys){g+=`<line x1="${L}" x2="${R}" y1="${Y(y)}" y2="${Y(y)}" stroke="var(--grid-line)"/><text x="${L-6}" y="${Y(y)+4}" text-anchor="end">${fmtNum(y)}</text>`;}
  for(let t=Math.ceil(p.t0/ts)*ts;t<=p.t1+1e-9;t+=ts){g+=`<line y1="${T}" y2="${B}" x1="${X(t)}" x2="${X(t)}" stroke="var(--grid-line)"/><text x="${X(t)}" y="${B+16}" text-anchor="middle">${fmtNum(t)}</text>`;}
  const zero=p.y0<0&&p.y1>0?Y(0):B;
  g+=`<line x1="${L}" x2="${R}" y1="${zero}" y2="${zero}" stroke="var(--ink)" stroke-width="1.2"/><line x1="${L}" x2="${L}" y1="${T}" y2="${B}" stroke="var(--ink)" stroke-width="1.2"/>`;
  let d="";for(let k=0;k<=120;k++){const t=p.t0+(p.t1-p.t0)*k/120;let y=evalExpr(p.expr,{t});y=Math.max(p.y0-1e3,Math.min(p.y1+1e3,y));d+=(k?"L":"M")+X(t).toFixed(1)+" "+Y(y).toFixed(1);}
  g+=`<clipPath id="clip"><rect x="${L}" y="${T}" width="${R-L}" height="${B-T}"/></clipPath><path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2.6" clip-path="url(#clip)"/>`;
  g+=`<text x="${L}" y="${T-9}" text-anchor="start" font-weight="600">${p.name} (${esc(p.unit)})</text><text x="${R}" y="${H-2}" text-anchor="end" font-weight="600">t (s)</text>`;
  if(it.tap&&q.answered){
    for(const t of it.tap.ts)g+=`<line x1="${X(t)}" x2="${X(t)}" y1="${T}" y2="${B}" stroke="var(--good)" stroke-width="2" stroke-dasharray="5 4"/>`;
    g+=`<line x1="${X(q.tapT)}" x2="${X(q.tapT)}" y1="${T}" y2="${B}" stroke="${q.ok?"var(--good)":"var(--bad)"}" stroke-width="2.5"/><circle cx="${X(q.tapT)}" cy="${B}" r="5" fill="${q.ok?"var(--good)":"var(--bad)"}"/>`;
  }
  const tapAttrs=it.tap&&!q.answered?` class="graph tappable" tabindex="0" aria-label="Graph of ${p.name} versus time. Tap a moment, or use the left and right arrow keys and Enter."`:` class="graph" aria-label="Graph of ${p.name} versus time"`;
  return `<div class="graphwrap"><svg viewBox="0 0 ${W} ${H}" role="img"${tapAttrs} data-l="${L}" data-r="${R}" data-b="${B}" data-t="${T}" font-family="IBM Plex Mono, monospace" font-size="11" fill="var(--muted)">${g}<line id="cursor" x1="-10" x2="-10" y1="${T}" y2="${B}" stroke="var(--accent)" stroke-width="2" opacity=".6"/><line id="selmark" x1="-10" x2="-10" y1="${T}" y2="${B}" stroke="var(--accent)" stroke-width="3" visibility="hidden"/></svg></div>`;
}
function wireTap(it,q,onSel){
  const svg=main.querySelector("svg.tappable");if(!svg)return;
  const p=it.plot,L=+svg.dataset.l,R=+svg.dataset.r;
  const toT=x=>Math.max(p.t0,Math.min(p.t1,p.t0+(x-L)/(R-L)*(p.t1-p.t0)));
  const cur=svg.querySelector("#cursor"),sel=svg.querySelector("#selmark");let kt=(p.t0+p.t1)/2;
  const xOf=t=>L+(t-p.t0)/(p.t1-p.t0)*(R-L);
  const place=t=>{const x=xOf(t);cur.setAttribute("x1",x);cur.setAttribute("x2",x);};
  const pick=t=>{q.tapT=t;kt=t;const x=xOf(t);sel.setAttribute("x1",x);sel.setAttribute("x2",x);sel.removeAttribute("visibility");onSel&&onSel();};
  svg.addEventListener("click",e=>{const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const m=svg.getScreenCTM();if(!m)return;pick(toT(pt.matrixTransform(m.inverse()).x));});
  svg.addEventListener("pointermove",e=>{if(e.pointerType!=="mouse")return;const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const m=svg.getScreenCTM();if(m)place(toT(pt.matrixTransform(m.inverse()).x));});
  svg.addEventListener("keydown",e=>{const st=(p.t1-p.t0)/40;
    if(e.key==="ArrowRight"||e.key==="ArrowLeft"){e.preventDefault();kt=Math.max(p.t0,Math.min(p.t1,kt+(e.key==="ArrowRight"?st:-st)));place(kt);}
    else if(e.key==="Enter"||e.key===" "){e.preventDefault();pick(kt);}});

/* ---------- Chapter 1: Mars landing ----------
   The landing computer brakes at a steady rate a = r × v²/(2h), where r is (number sent) ÷ (right number).
   r = 1 stops the probe right at the ground. r < 1 brakes too gently and it hits the ground.
   r > 1 stops it too high; the computer thinks it has landed, cuts the engine, and the probe falls. Mars g = 3.71 m/s². */
const MARS_G=3.71, LAND_NAMES=["Speed check","Formula check","Pounds or newtons"];
const big=x=>Number(x.toPrecision(3)).toLocaleString("en-US"), bigT=x=>big(x).replace(/,/g,"{,}");
function landSim(v0,h0,r){
  const a=r*v0*v0/(2*h0), t0=0.25*h0/v0, top=h0*1.25;
  let ts,hs,tImp,kind,speed;
  if(Math.abs(r-1)<1e-9){ts=2*h0/v0;hs=0;tImp=ts;kind="land";speed=0;}
  else if(r<1){const d=v0*v0-2*a*h0;tImp=(v0-Math.sqrt(d))/a;ts=tImp;hs=0;kind="crash";speed=Math.sqrt(d);}
  else{ts=v0/a;hs=h0-v0*v0/(2*a);tImp=ts+Math.sqrt(2*hs/MARS_G);kind="stall";speed=MARS_G*(tImp-ts);}
  const at=t=>{
    if(t<t0)return{y:top-v0*t,v:-v0,burn:false};
    const u=Math.min(t-t0,tImp);
    if(u<ts)return{y:Math.max(0,h0-v0*u+0.5*a*u*u),v:-v0+a*u,burn:true};
    const w=u-ts;return{y:Math.max(0,hs-0.5*MARS_G*w*w),v:-MARS_G*w,burn:false};};
  return{at,tEnd:t0+tImp,tStop:t0+ts,h0,top,hs,kind,speed,v0};
}
function makeLanding(k){

/* ---------- Chapter 2: sail to the island ----------
   Map units are km, x east and y north. Each choice carries `end`, where the boat stops, and `aim`, where its bow points.
   The boat reaches the island when it stops within ISLE_R × (distance to the island) of the island's center.

function makeSail(k){

    const pts=[[0,0],m.isle];m.choices.forEach(c=>{pts.push(c.end);if(m.kind===1)pts.push(c.aim);});
    m.box=[Math.min(...pts.map(p=>p[0])),Math.max(...pts.map(p=>p[0])),Math.min(...pts.map(p=>p[1])),Math.max(...pts.map(p=>p[1]))];

function sailSim(m,c){

function drawSail(t,F,m){

  if(cv.width!==Math.round(W*dpr)){cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);}
  const ctx=cv.getContext("2d");ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);
  const cs=getComputedStyle(document.documentElement),col=n=>cs.getPropertyValue(n).trim()||"#888";

  ctx.strokeStyle=col("--petal-2");ctx.lineWidth=1.5;ctx.stroke();

TOYS.sail.game={title:"Sail to the island",intro:"The boat goes exactly where you send it. Set the right course and it lands on the island.",
  names:SAIL_NAMES,make:makeSail,ms:3400,

/* ---------- Chapter 4: catapult ----------
   Side view in meters, g = 10 m/s² as in the Ch 4 notes. The stone always leaves at about 53° (cos 0.6, sin 0.8),

const catComp=v=>`v_x&=0.6(${v})=${fmtNum(0.6*v,true)}\\ \\text{m/s}\\\\v_y&=0.8(${v})=${fmtNum(0.8*v,true)}\\ \\text{m/s}\\\\`;

      work:`\\begin{aligned}${catComp(v)}t&=\\tfrac{d}{v_x}=\\tfrac{${fmtNum(d,true)}}{${fmtNum(f0.vx,true)}}=${fmtNum(t,true)}\\ \\text{s}\\\\y&=v_yt-\\tfrac12gt^2=${fmtNum(y,true)}\\ \\text{m}\\end{aligned}`};}

    work:`\\begin{aligned}v&=\\tfrac{2\\pi r}{T}\\\\T&=\\tfrac{2\\pi r}{v}=\\tfrac{2\\pi(${r})}{${v}}=${fmtNum(T,true)}\\ \\text{s}\\end{aligned}`};

function catSim(m,c){

/* ---------- Chapter 5: elevator ----------
   g = 10 m/s² as in the Ch 5 notes, up is positive. Every ride: 0.5 s at rest, 2 s speeding up at a, 1.5 s at steady speed,
   2 s slowing down at a, 0.5 s at rest, so the car travels 7a meters. The scale reads N = m(g + a_up).
   Mission 0: predict the scale while speeding up on the way up. Mission 1: one of the other three cases.
   Mission 2: pick the cable tension so the car (car plus riders) speeds up at a; it must reach the floor sensor after 3 s.
   makeElv redraws until every wrong choice misses by at least 2.5 times the tolerance. */
const ELV_NAMES=["Going up","Heavier or lighter?","Set the motor"], ELV_G=10;

/* ---------- Chapter 6: race car ----------
   g = 10 m/s² as in the Ch 6 notes. Top view in meters, same scale both ways. The track: a straight going up (x = r),
   a half circle of radius r around the origin, and a straight coming back down (x = −r).
   On a curve the car can turn with at most a_max sideways: μs·g on a flat curve, exactly g·tanθ on an icy banked one.
   It follows a circle of radius v²/a_max (never tighter than the track on a flat curve, where friction can be smaller),
   so too fast drifts outward and, on the icy bank, too slow drifts inward. Leaving the track edge ends the run.
   Mission 0: fastest speed on a flat curve (a rival car drives the right speed). Mission 1: the speed for an icy banked curve.
   Mission 2: top speed on the straight, where the engine's push balances drag: v = √(2F/(CρA)).
   makeRace redraws until every wrong choice misses by at least 2.5 times the tolerance (2.5% of the right speed). */
const RACE_NAMES=["Flat curve","Banked turn","Top speed"], RACE_G=10, RACE_RHO=1.2;
const raceTol=m=>0.025*m.vok;
function raceDraft(k){
  if(k===0){const r=pickOne([40,50,60,80,100]),[mus,muk]=pickOne([[0.9,0.7],[0.8,0.6],[0.7,0.5],[0.6,0.4]]);
    const vok=Math.sqrt(mus*r*RACE_G);

      {v:Math.sqrt(muk*r*RACE_G),fb:"Tires that roll without slipping grip with static friction, so use \\(\\mu_s\\), not \\(\\mu_k\\). That speed was safe but slow, and the rival passed you."},
      {v:Math.sqrt(r*RACE_G),fb:"The most friction can give is \\(\\mu_sN\\), not \\(N\\). Without \\(\\mu_s\\) the speed is too high and the car slides off."},
      {v:Math.sqrt(mus*RACE_G/r),fb:"From \\(\\mu_sg = v^2/r\\), multiply both sides by \\(r\\): \\(v^2 = \\mu_srg\\)."}];
    ch.forEach(c=>{c.t=`${fmtNum(c.v)} m/s`;});
    return{kind:0,r,mus,muk,vok,amax:mus*RACE_G,choices:dedupe(ch),
      q:`A race car takes a flat curve of radius \\(${r}\\ \\text{m}\\). Between its tires and the track \\(\\mu_s = ${mus}\\) and \\(\\mu_k = ${muk}\\). What is the fastest speed it can take the curve without sliding? Use \\(g = 10\\ \\text{m/s}^2\\).`,
      work:`\\begin{aligned}\\mu_smg&=\\tfrac{mv^2}{r}\\\\v&=\\sqrt{\\mu_srg}\\\\&=\\sqrt{${mus}(${r})(10)}\\\\&=${fmtNum(vok,true)}\\ \\text{m/s}\\end{aligned}`,
      after:`The mass cancels, so a heavy car and a light car have the same top speed on this curve.`};}
  if(k===1){const r=pickOne([50,80,100,120,150]),th=pickOne([30,35,40]),tn=+Math.tan(th*Math.PI/180).toFixed(3);
    const vok=Math.sqrt(r*RACE_G*tn);
    const ch=[{v:vok,ok:true},
      {v:Math.sqrt(r*RACE_G),fb:"Only the sideways part of the normal force, \\(N\\sin\\theta\\), turns the car. Dividing it by the vertical part, \\(N\\cos\\theta = mg\\), brings in \\(\\tan\\theta\\)."},
      {v:Math.sqrt(r*RACE_G/tn),fb:"Dividing \\(N\\sin\\theta = mv^2/r\\) by \\(N\\cos\\theta = mg\\) gives \\(\\tan\\theta = v^2/(rg)\\), so \\(\\tan\\theta\\) multiplies \\(rg\\)."},
      {v:Math.sqrt(r*RACE_G*Math.sin(th*Math.PI/180)),fb:"On a bank the normal force is not \\(mg\\). Its vertical part balances gravity, \\(N\\cos\\theta = mg\\), and that turns \\(\\sin\\theta\\) into \\(\\tan\\theta\\)."}];
    ch.forEach(c=>{c.t=`${fmtNum(c.v)} m/s`;});
    return{kind:1,r,th,tn,vok,amax:RACE_G*tn,choices:dedupe(ch),
      q:`A curve of radius \\(${r}\\ \\text{m}\\) is banked at \\(${th}^\\circ\\ (\\tan ${th}^\\circ = ${tn})\\). The track is icy, so there is no friction. At what speed can a car take the curve without sliding up or down the bank? Use \\(g = 10\\ \\text{m/s}^2\\).`,
      work:`\\begin{aligned}N\\cos\\theta&=mg\\\\N\\sin\\theta&=\\tfrac{mv^2}{r}\\\\\\tan\\theta&=\\tfrac{v^2}{rg}\\\\v&=\\sqrt{rg\\tan\\theta}\\\\&=\\sqrt{${r}(10)(${tn})}\\\\&=${fmtNum(vok,true)}\\ \\text{m/s}\\end{aligned}`,

  const ch=[{v:vok,ok:true},
    {v:Math.sqrt(F/(C*RACE_RHO*A)),fb:"Drag is \\(\\tfrac12C\\rho Av^2\\). Solving for \\(v\\) puts a 2 on top: \\(v = \\sqrt{2F/(C\\rho A)}\\)."},
    {v:Math.sqrt(2*F/(RACE_RHO*A)),fb:"The drag coefficient \\(C\\) belongs in the drag force. Leaving it out makes the drag look smaller, so the top speed comes out too high."},
    {v:Math.sqrt(2*F/(C*A)),fb:"Drag depends on the density of the air, \\(\\rho\\). Without it the units don't even come out as a speed."}];
  ch.forEach(c=>{c.t=`${fmtNum(c.v)} m/s`;});
  return{kind:2,F,C,A,mass,vok,choices:dedupe(ch),
    q:`On the long straight, the engine of a \\(${mass}\\ \\text{kg}\\) race car pushes it forward with \\(${F}\\ \\text{N}\\). Air drag is \\(\\tfrac12C\\rho Av^2\\) with \\(C = ${C}\\), \\(A = ${A}\\ \\text{m}^2\\), and \\(\\rho = 1.2\\ \\text{kg/m}^3\\). What is the car's top speed?`,
    work:`\\begin{aligned}F&=\\tfrac12C\\rho Av^2\\\\v&=\\sqrt{\\tfrac{2F}{C\\rho A}}\\\\&=\\sqrt{\\tfrac{2(${F})}{(${C})(1.2)(${A})}}\\\\&=${fmtNum(vok,true)}\\ \\text{m/s}\\end{aligned}`,
    after:`At top speed the push and the drag balance, so the net force is zero and the car stops speeding up. That's about ${Math.round(vok*3.6)} km/h. The mass only sets how long it takes to get there.`};
}
/* the path of a car on the track at speed v: position and heading after driving a distance s */
function racePath(m,v){
  const r=m.r,L=0.7*r,hw=Math.max(5,0.08*r),need=v*v/r;
  let rp=r;
  if(m.kind===0){if(need>m.amax)rp=v*v/m.amax;}else rp=v*v/m.amax;
  const S=2*L+Math.PI*r;
  const at0=s=>{
    if(s<=L)return{x:r,y:-L+s,h:Math.PI/2};
    if(Math.abs(rp-r)<1e-9*r){const u=s-L;if(u<=Math.PI*r){const f=u/r;return{x:r*Math.cos(f),y:r*Math.sin(f),h:f+Math.PI/2};}
      return{x:-r,y:-(u-Math.PI*r),h:-Math.PI/2};}
    const f=(s-L)/rp;return{x:r-rp+rp*Math.cos(f),y:rp*Math.sin(f),h:f+Math.PI/2};};

  let sOff=null;
  if(Math.abs(rp-r)>1e-9*r){for(let s=L;s<=L+Math.PI*rp*1.2;s+=r/400){const p=at0(s),d=Math.hypot(p.x,p.y);if(d>r+hw||d<r-hw){sOff=s;break;}}}

  if(sOff!=null){const b=at0(sOff),d=Math.hypot(b.x,b.y),outw=d>r,ux=b.x/d,uy=b.y/d,tx=Math.cos(b.h),ty=Math.sin(b.h);
    const fwd=0.14*r,side=(outw?1:-1)*(m.kind===1?0.16:0.1)*r,D=m.kind===1&&outw?0:Math.hypot(fwd,side);
    sEnd=sOff+D;
    at=s=>{if(s<=sOff)return at0(s);const u=D?Math.min(1,(s-sOff)/D):0,e=u*(2-u);return{x:b.x+e*(fwd*tx+side*ux),y:b.y+e*(fwd*ty+side*uy),h:b.h};};}

function raceSim(m,c){
  if(m.kind===2){const vt=m.vok,k=m.F/(m.mass*vt),tEnd=Math.ceil(2.65/k/10)*10;
    const v=t=>vt*Math.tanh(k*t),x=t=>Math.log(Math.cosh(k*t))*vt/k;
    return{kind:2,tEnd,vAt:v,xAt:x,vt,aim:c.v,miss:Math.abs(c.v-vt),hit:Math.abs(c.v-vt)<=raceTol(m)};}
  const P=racePath(m,c.v),G=racePath(m,m.vok);

  const off=P.sOff!=null,tEnd=off?tCar:Math.min(tCar,1.4*tG);
  const hit=Math.abs(c.v-m.vok)<=raceTol(m);
  return{kind:m.kind,P,G,tG,tEnd,off,slow:!off&&!hit,done:!off&&tCar<=tEnd+1e-9,
    out:off&&Math.hypot(P.at(P.sOff).x,P.at(P.sOff).y)>P.r,aim:c.v,miss:Math.abs(c.v-m.vok),hit};
}
function makeRace(k){
  for(let tries=0;tries<500;tries++){
    const m=raceDraft(k);if(!m||m.choices.length<4)continue;
    const tol=raceTol(m);
    if(!m.choices.every(c=>c.ok||Math.abs(c.v-m.vok)>=2.5*tol))continue;
    /* every wrong choice must fail where you can see it: slide off, or lose to the rival on the flat curve */
    if(!m.choices.every(c=>{if(c.ok)return true;const F=raceSim(m,c);return m.kind===2||F.off||(m.kind===0&&F.slow);}))continue;
